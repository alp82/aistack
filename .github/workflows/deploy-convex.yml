name: Deploy Convex to Production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-convex:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts
          
      # FETCH AND RESET, never `git pull`.
      #
      # `pnpm convex deploy` REGENERATES `convex/_generated/`, which is tracked.
      # So every successful deploy leaves the server's working tree dirty, and
      # the next `git pull` aborts with "local changes would be overwritten".
      # That silently froze production at #72 while three deploys reported
      # failure and nobody was blocked by it.
      #
      # A hard reset makes the checkout match origin exactly, whatever the last
      # deploy wrote. It does not touch untracked files, so the server's `.env`
      # is safe.
      - name: Deploy to production
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded backend deployment. Dispatch main to retry the current release."
            exit 0
          fi
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} "bash -l -c 'cd ~/aistack && git fetch origin main && git reset --hard ${{ github.sha }} && /root/.local/share/pnpm/pnpm i && /root/.local/share/pnpm/pnpm convex deploy'"

      - name: Check whether this release is still current
        id: current
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ]; then
            echo "register=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main revision will register its commands after deployment."
          fi

      - name: Wait for the matching Coolify renderer
        if: steps.current.outputs.register == 'true'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          DISCORD_RENDER_ORIGIN: https://aistack.to
        run: node scripts/wait-for-discord-renderer.ts

      - name: Register and verify global Discord commands
        if: steps.current.outputs.register == 'true'
        env:
          DISCORD_APP_ID: '1540381573243736116'
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
          DISCORD_RENDER_ORIGIN: https://aistack.to
        run: |
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded registration."
            exit 0
          fi
          node scripts/discord-register-commands.ts --output-dir discord-registration

      - name: Preserve Discord registration and recovery payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discord-registration-${{ github.sha }}
          path: discord-registration/*.json
          if-no-files-found: ignore
          retention-days: 90
