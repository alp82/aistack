name: Deploy Convex to Production

on:
  push:
    branches: [main]

jobs:
  deploy-convex:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PROD_SSH_HOST }} >> ~/.ssh/known_hosts
          
      # FETCH AND RESET, never `git pull`.
      #
      # `pnpm convex deploy` REGENERATES `convex/_generated/`, which is tracked.
      # So every successful deploy leaves the server's working tree dirty, and
      # the next `git pull` aborts with "local changes would be overwritten".
      # That silently froze production at #72 while three deploys reported
      # failure and nobody was blocked by it.
      #
      # A hard reset makes the checkout match origin exactly, whatever the last
      # deploy wrote. It does not touch untracked files, so the server's `.env`
      # is safe.
      - name: Deploy to production
        run: |
          ssh ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }} "bash -l -c 'cd ~/aistack && git fetch origin main && git reset --hard origin/main && /root/.local/share/pnpm/pnpm i && /root/.local/share/pnpm/pnpm convex deploy'"
