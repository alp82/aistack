/* ---------- formatters (mirroring measured/copy.ts) ---------- */
const fmtT = n => n>=1e9?(n/1e9).toFixed(2)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(0)+"K":String(n);
const fmtUSD = n => "$"+Math.round(n).toLocaleString("en-US");
const pct = (x,d=0) => (x*100).toFixed(d)+"%";
const num = n => Math.round(n).toLocaleString("en-US");
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const price = a => a>0 ? "$"+(Math.abs(a-Math.round(a))<0.005?Math.round(a):Math.floor(a)) : "$0";
const priceMo = a => price(a)+"/mo";
const row = id => W.rows.find(r=>r.id===id);
const rowVal = r => r.unit==="share"?pct(r.value):r.unit==="hour"?String(Math.round(r.value)).padStart(2,"0")+":00":r.unit==="minutes"?(r.value>=10?Math.round(r.value):r.value.toFixed(1))+" min":String(Math.round(r.value));
const toolsSorted = [...S.tools].sort((a,b)=>b.amount-a.amount);
const guideMin = Math.max(1,Math.ceil(S.guide.words/200));
const deltaTokens = U.totalTokens-U.prevTokens;
const modelRows = U.models.filter(m=>m.share>=0.0005);
const readCheckedAgo = "23 min ago"; // receivedAt vs capture date, static in the demo

/* ---------- tiny chart helpers (single series wears the accent) ---------- */
function spark(series,wpx,hpx,cls){
  const max = Math.max(...series.map(p=>p.t),1);
  const pts = series.map((p,i)=>`${(i/(series.length-1))*wpx},${hpx-2-(p.t/max)*(hpx-4)}`).join(" ");
  return `<svg class="${cls||""}" width="100%" height="${hpx}" viewBox="0 0 ${wpx} ${hpx}" preserveAspectRatio="none" role="img" aria-label="daily tokens"><polyline points="${pts}" fill="none" stroke="var(--lime)" stroke-width="2"/></svg>`;
}
function shareBar(share,dim){
  return `<span class="bar-track"><span class="bar-fill${dim?" dim":""}" style="width:${Math.max(1,share*100)}%"></span></span>`;
}
/* phase mix stacked strip: one measure (share of measured time), single-hue steps */
function phaseStrip(h){
  const ps = W.lead.phaseShare;
  const parts=[["scout",ps.scout,"oklch(0.78 0.17 132)"],["build",ps.build,"oklch(0.62 0.13 132)"],["verify",ps.verify,"oklch(0.48 0.1 132)"],["handoff",ps.handoff,"oklch(0.38 0.06 132)"],["unknown",ps.unknown,"oklch(0.32 0.01 256)"]];
  return `<div style="display:flex;height:${h}px;gap:2px">`+parts.map(([n,v,c])=>`<span title="${n} ${pct(v)}" style="background:${c};width:${v*100}%"></span>`).join("")+`</div>
  <div class="small muted" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">`+parts.map(([n,v])=>`<span>${n} ${pct(v)}</span>`).join("")+`</div>`;
}
</script>

/* =========================================================================
   Shared compact building blocks. Cut everywhere (all five variants):

const wfCells = W.rows.map(r=>({id:r.id,name:r.name,fig:rowVal(r),label:r.label}));

    `<div style="display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;margin:8px 0 14px">

<script>

const TOOL_ICON = Object.fromEntries(S.tools.map(t=>[t.name,t.icon]));

const MODEL_PROVIDER = Object.fromEntries(S.models.map(m=>[m.name,m.provider]));
const OFFSET_H = Math.round((W.utcOffsetMin||0)/60);
const localH = h => (h+OFFSET_H+24)%24;

function icn(src,name,px,extra){
  if(src) return `<img src="${src}" alt="" style="width:${px}px;height:${px}px;object-fit:contain;border:1px solid var(--stroke);padding:${Math.max(2,px/12)}px;background:var(--bg-panel);${extra||""}">`;
  return `<span class="mono lime" style="width:${px}px;height:${px}px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--stroke);font-weight:700;font-size:${px*0.45}px;${extra||""}">${esc((name||"?")[0])}<\/span>`;
}
const toolIcn=(t,px,extra)=>icn(t.icon,t.name,px,extra);
const modelIcn=(name,px)=>icn(PROVIDER_ICON[MODEL_PROVIDER[name]]||PROVIDER_ICON[(name.match(/GPT/i)?"OpenAI":name.match(/Claude|Fable/i)?"Anthropic":name.match(/Gemini/i)?"Google":"")],name,px);

/* 7x24 commit heatmap, hours shifted to owner-local; single-hue lime scale */
function heatmap(cellH){
  const grid=Array.from({length:7},()=>Array(24).fill(0));
  for(const [wd,h,c] of (W.heat||[])) grid[wd][localH(h)]+=c;
  const max=Math.max(1,...grid.flat());
  const days=["mo","tu","we","th","fr","sa","su"];
  // weekdayUtc 0=Sunday in JS convention; reorder Mon-first
  const order=[1,2,3,4,5,6,0];
  return `<div style="display:grid;grid-template-columns:22px repeat(24,1fr);gap:2px" class="small muted">`+
    order.map((wd,ri)=>`<span style="font-size:9px;line-height:${cellH}px">${days[ri]}<\/span>`+
      grid[wd].map(v=>`<span title="${v}" style="height:${cellH}px;background:oklch(0.78 0.17 132 / ${v===0?0.06:0.15+0.85*(v/max)})"><\/span>`).join("")).join("")+
    `<\/div><div class="small muted" style="display:flex;justify-content:space-between;margin-top:2px;font-size:9px"><span>00<\/span><span>06<\/span><span>12<\/span><span>18<\/span><span>23<\/span><\/div>`;
}
/* 24-column session start-hour chart */
function startHoursChart(h){
  const arr=Array(24).fill(0);
  for(const [hr,s] of (W.startHours||[])) arr[localH(hr)]+=s;
  const max=Math.max(1,...arr);
  return `<div style="display:flex;align-items:flex-end;gap:2px;height:${h}px">`+
    arr.map((v,i)=>`<span title="${String(i).padStart(2,"0")}:00 · ${v}" style="flex:1;background:${v===max?"var(--lime)":"var(--bg-panel-muted)"};height:${Math.max(2,v/max*h)}px"><\/span>`).join("")+`<\/div>`;
}
/* commits per day columns */
function gitBars(h){
  const max=Math.max(1,...W.gitDays.map(g=>g.c));
  return `<div style="display:flex;align-items:flex-end;gap:2px;height:${h}px">`+
    W.gitDays.map(g=>`<span title="${g.d} · ${g.c} commits" style="flex:1;background:var(--lime);opacity:${0.35+0.65*g.c/max};height:${Math.max(2,g.c/max*h)}px"><\/span>`).join("")+`<\/div>`;
}
const UP="▲", ASCII_BAR=(share,w)=>{const n=Math.round(share*w);return "█".repeat(n)+"░".repeat(w-n);};

        ${[["spend",fmtUSD(U.usd)],["cost",priceMo(S.price)],["sessions",num(U.sessions)]].map(([k,v])=>`<div><div style="font-weight:900;font-size:19px;color:var(--lime-contrast)">${v}<\/div><div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime-contrast);opacity:.7">${k}<\/div><\/div>`).join("")}
      <\/div>
    <\/div>
    <div style="mix-blend-mode:multiply;margin:0 -28px -10px">${spark(U.series,600,64).replace('var(--lime)','var(--lime-contrast)')}<\/div>
  <\/div>`;
  const h=(t,m)=>`<div style="display:flex;align-items:baseline;gap:10px;margin:26px 0 10px"><b style="text-transform:uppercase;letter-spacing:.06em;font-size:15px">${t}<\/b><span class="small muted">${m||""}<\/span><span style="flex:1;border-top:2px solid var(--lime)"><\/span><\/div>`;
  const right=`
  <div style="padding:20px 26px 40px;min-width:0">

    ${modelRows.map(m=>`<div style="display:flex;gap:10px;align-items:center;padding:3px 0" class="small">${modelIcn(m.name,20)}<span style="width:110px">${esc(m.name)}<\/span>${shareBar(m.share,true)}<b class="mono" style="width:44px;text-align:right">${pct(m.share)}<\/b><\/div>`).join("")}
    ${h("Measured","15 numbers, no ranking")}
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 18px">
      ${wfCells.map(c=>`<div><div class="mono lime" style="font-size:22px;font-weight:900">${c.fig}<\/div><p class="small sec2"><b>${c.name}<\/b><\/p><\/div>`).join("")}

    ${h("Projects",P.length+"")}
    ${P.map(p=>`<div style="display:flex;gap:8px;padding:3px 0" class="small"><b style="width:110px;flex:none">${esc(p.name)}<\/b><span class="muted" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.desc||p.tags.join(" · "))}<\/span>${p.url?"<span class='lime'>↗<\/span>":""}<\/div>`).join("")}
    ${h("Tools",S.tools.length+" · "+priceMo(S.price))}
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${toolsSorted.map(t=>`<span style="display:inline-flex;align-items:center;gap:6px;border:1px solid var(--stroke);padding:5px 9px" class="small">${toolIcn(t,18,"border:0;background:transparent;padding:0")}<b>${esc(t.name)}<\/b><span class="mono lime">${t.bundle?"bdl":t.amount>0?price(t.amount):"free"}<\/span><\/span>`).join("")}
    <\/div>
    ${h("Guide",guideMin+" min")}
    <p class="small sec2" style="line-height:1.65;max-width:520px">${esc(S.guide.firstp)}<\/p>

    <p class="mono muted" style="font-size:10px;margin-top:16px">${COST_NOTE}<\/p>
    <p style="margin-top:22px"><span class="mono" style="background:var(--lime);color:var(--lime-contrast);padding:8px 18px;font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase">Share your own stack →<\/span><\/p>

  return `<div style="display:grid;grid-template-columns:minmax(340px,44%) 1fr;max-width:1400px;margin:0 auto" class="sh">
    ${left}${right}<\/div>

</script>
<script>
/* PROTOTYPE - throwaway (ticket alp82/aistack#351). Round 3: ten designs on
   the liked directions (V6/V9 look, V7/V10 section ideas, V15 right column),
   now with the deep data in: every measurement carries its own micro chart. */
"use strict";

/* ---------- round-3 shared helpers ---------- */
const EFFORT_TOTAL=Object.values(W.effort).reduce((a,b)=>a+b,0);
const effortShare=k=>(W.effort[k]||0)/EFFORT_TOTAL;
const barRow=(label,share,val,dark)=>`<div style="display:flex;gap:8px;align-items:center;padding:2px 0;cursor:help" class="small" title="${label}: ${val??pct(share,1)}">
  <span style="width:96px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${label}<\/span>
  <span class="bar-track" style="height:6px;${dark?"background:oklch(0.9 0.004 256)":""}"><span class="bar-fill" style="width:${Math.max(1,share*100)}%;${dark?"background:oklch(0.55 0.18 132)":""}"><\/span><\/span>
  <b class="mono" style="width:40px;text-align:right">${val??pct(share)}<\/b><\/div>`;
const dotRow=(n,of,dark)=>{const c=dark?"oklch(0.55 0.18 132)":"var(--lime)";const g=dark?"oklch(0.85 0.004 256)":"var(--bg-panel-muted)";
  return `<div style="display:flex;gap:3px;flex-wrap:wrap">${Array.from({length:of},(_,i)=>`<span style="width:8px;height:8px;background:${i<n?c:g}"><\/span>`).join("")}<\/div>`;};
const seg3=(shares,labels,dark)=>`<div style="display:flex;height:10px;gap:2px">${shares.map((s,i)=>`<span title="${labels[i]} ${pct(s)}" style="width:${s*100}%;background:oklch(${dark?0.55-i*0.12:0.78-i*0.16} ${0.18-i*0.05} 132)"><\/span>`).join("")}<\/div>
  <div class="small muted" style="display:flex;gap:10px;margin-top:3px">${labels.map((l,i)=>`<span>${l} ${pct(shares[i])}<\/span>`).join("")}<\/div>`;
/* one micro visual per measurement id; h ~ 30-60px; dark=on light bg */
function microViz(id,dark){
  switch(id){
    case "component:activity-heatmap": return heatmap(7);
    case "component:start-hours": return startHoursChart(30);
    case "metric:late-night-commits": return barRow("23:00-03:00",row("metric:late-night-commits").value,null,dark)+barRow("daytime",1-row("metric:late-night-commits").value,null,dark);
    case "component:phase-playbook": return phaseStrip(10);
    case "component:git-ledger": return gitBars(30);
    case "component:coding-languages": return W.langs.slice(0,3).map(l=>barRow(l.ext,l.share,null,dark)).join("");
    case "component:kit": return W.skills.slice(0,3).map(s=>barRow(s.name,s.share,null,dark)).join("");
    case "component:model-routing": return modelRows.slice(0,3).map(m=>barRow(m.name,m.share,null,dark)).join("");
    case "component:delegation": return barRow("subagents",row("component:delegation").value,null,dark)+barRow("main loop",1-row("component:delegation").value,null,dark);
    case "metric:effort-levels": return seg3([effortShare("high"),effortShare("medium"),effortShare("low")],["high","med","low"],dark);
    case "metric:thinking-share": return barRow("thinking",row("metric:thinking-share").value,null,dark)+barRow("visible",1-row("metric:thinking-share").value,null,dark);
    case "metric:turn-duration": return `<div class="small muted">median turn, capped gaps<\/div>`+barRow("≈",Math.min(1,row("metric:turn-duration").value/5),rowVal(row("metric:turn-duration")),dark);
    case "metric:question-back-share": return `<div class="small muted">no turn ends with a question back<\/div>`;
    case "metric:web-searches-per-active-day": return dotRow(Math.round(row("metric:web-searches-per-active-day").value),10,dark)+`<div class="small muted" style="margin-top:3px">${W.webSearches} total · ${U.activeDays} days<\/div>`;
    case "metric:parallel-projects": return dotRow(7,12,dark)+`<div class="small muted" style="margin-top:3px">median active day · peak 31<\/div>`;
    default: return "";
  }
}
const modelTableRows=(dark)=>modelRows.map(m=>`
  <div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid ${dark?"oklch(0.65 0.008 256/.6)":"var(--stroke)"}">
    ${modelIcn(m.name,22)}<b style="width:128px;font-size:13px">${esc(m.name)}<\/b>
    <span class="bar-track" style="height:10px;${dark?"background:oklch(0.9 0.004 256)":""}"><span class="bar-fill" style="width:${m.share*100}%;${dark?"background:oklch(0.55 0.18 132)":""}"><\/span><\/span>
    <b class="mono small" style="width:44px;text-align:right">${pct(m.share,1)}<\/b>
    <span class="mono small muted" style="width:52px;text-align:right">${fmtUSD(m.usd)}<\/span>
    <span class="mono small muted" style="width:48px;text-align:right">${fmtT(m.tokens)}<\/span><\/div>`).join("");
const toolTableRows=(dark)=>toolsSorted.map(t=>`
  <div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid ${dark?"oklch(0.65 0.008 256/.6)":"var(--stroke)"}">
    ${toolIcn(t,24)}<b style="width:118px;font-size:13px;flex:none">${esc(t.name)}<\/b>
    <span class="small muted" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.cat)} · ${esc(t.tier)}<\/span>
    <b class="mono small" style="${dark?"color:oklch(0.55 0.18 132)":"color:var(--lime)"}">${t.bundle?"bundle":t.amount>0?priceMo(t.amount):"free"}<\/b><\/div>`).join("");
const projRowsDeep=(dark)=>P.map(p=>`
  <div style="padding:6px 0;border-bottom:1px solid ${dark?"oklch(0.65 0.008 256/.6)":"var(--stroke)"}">
    <div style="display:flex;gap:8px;align-items:baseline"><b>${esc(p.name)}<\/b><span class="small muted">${p.tags.join(" · ")}<\/span>${p.url?`<span style="margin-left:auto;${dark?"color:oklch(0.55 0.18 132)":"color:var(--lime)"}">↗<\/span>`:""}<\/div>
    ${p.desc?`<p class="small ${dark?"":"sec2"}" style="margin-top:2px;${dark?"color:oklch(0.3 0.006 256)":""}">${esc(p.desc)}<\/p>`:""}<\/div>`).join("");
const statStrip=(dark)=>`<div style="display:flex;gap:26px;flex-wrap:wrap" class="mono">
  ${[[num(U.sessions),"sessions"],[U.activeDays+"/30","active days"],[pct(U.cacheHitShare,1),"cache hits"],[pct(U.subagentShare,1),"subagent tokens"],[num(W.git.commits),"commits"]]
    .map(([v,k])=>`<div><div style="font-weight:900;font-size:20px">${v}<\/div><div class="small muted" style="font-size:10px;letter-spacing:.1em;text-transform:uppercase">${k}<\/div><\/div>`).join("")}<\/div>`;
const NUM7=(n,color)=>`<span class="mono" style="font-size:clamp(44px,6vw,72px);font-weight:900;line-height:.9;color:${color||"var(--stroke-strong)"}">${n}<\/span>`;

/* =========================================================================
   V16 MAGAZINE DEEP - V6 grown up: the real page's numbered headers return,
   every measurement is a small editorial feature with its own micro chart.
   ========================================================================= */
function renderV16(){
  const wrap=i=>`<div style="max-width:1220px;margin:0 auto;padding:0 24px">${i}<\/div>`;
  const band=(light,inner)=>`<section style="background:${light?"oklch(0.95 0.005 256)":"var(--bg-canvas)"};color:${light?"oklch(0.15 0.008 256)":"var(--fg-primary)"};padding:44px 0">${wrap(inner)}<\/section>`;
  const head=(n,kick,title,meta,light)=>`
    <div style="display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid ${light?"oklch(0.65 0.008 256)":"var(--stroke)"};padding-bottom:12px;margin-bottom:24px">
      ${NUM7(n,light?"oklch(0.8 0.01 256)":"var(--stroke-strong)")}
      <div style="flex:1"><p class="kick" style="color:${light?"oklch(0.55 0.18 132)":"var(--lime)"}">${kick}<\/p>
      <h2 style="font-size:clamp(24px,3.4vw,34px);font-weight:900;text-transform:uppercase;letter-spacing:-.01em">${title}<\/h2><\/div>
      <span class="mono small" style="color:${light?"oklch(0.45 0.005 256)":"var(--fg-muted)"}">${meta||""}<\/span><\/div>`;
  const hero=band(false,`
    <div style="display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end">
      <div style="flex:1;min-width:300px">
        <h1 style="font-size:clamp(44px,7vw,84px);font-weight:900;line-height:.88;letter-spacing:-.03em;text-transform:uppercase">${esc(S.name)}<\/h1>
        <p style="margin-top:12px;font-size:17px;color:var(--fg-secondary);max-width:520px">${esc(S.oneLiner)}<\/p>
        <p class="small muted" style="margin-top:8px">${esc(S.creator.name)} @${esc(S.creator.handle)} · ${UP} 12 · Share · Report<\/p>
      <\/div>
      <div style="text-align:right"><div class="mono" style="font-size:clamp(40px,5vw,60px);font-weight:900">${price(S.price)}<span style="font-size:17px;color:var(--fg-muted)">/mo<\/span><\/div>
      <div style="display:flex;gap:6px;margin-top:12px;justify-content:flex-end">${toolsSorted.slice(0,6).map(t=>toolIcn(t,30)).join("")}<span class="chip">+${S.tools.length-6}<\/span><\/div><\/div>
    <\/div>`);
  const usage=band(false,head("01","// sync","Actual Usage",`30d · checked ${readCheckedAgo}`)+`
    <div style="display:grid;grid-template-columns:minmax(0,420px) 1fr;gap:36px" class="g2">
      <div>
        <div class="mono lime" style="font-size:clamp(56px,7vw,84px);font-weight:900;line-height:.9">${fmtT(U.totalTokens)}<\/div>
        <p class="small muted" style="margin-top:4px">tokens · 30 days · <b class="sec2">${fmtUSD(U.usd)}<\/b> at list prices<\/p>
        ${spark(U.series,420,64)}
        <div style="margin-top:18px">${statStrip(false)}<\/div>
      <\/div>
      <div>${modelTableRows(false)}
        <p class="small muted" style="margin-top:8px">${COST_NOTE}<\/p><\/div>
    <\/div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:26px 30px;margin-top:36px">
      ${wfCells.map(c=>`<div style="border-top:2px solid var(--lime);padding-top:8px">
        <div style="display:flex;align-items:baseline;gap:10px"><b class="mono" style="font-size:26px">${c.fig}<\/b><span class="small sec2"><b>${c.name}<\/b><\/span><\/div>
        <p class="small muted" style="margin:2px 0 8px">${c.label}<\/p>${microViz(c.id,false)}<\/div>`).join("")}
    <\/div>`);
  const projects=band(true,head("02","// showcase","Projects",P.length+" projects",true)+
    `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px">
     ${P.map(p=>`<div style="background:#fff;border:1px solid oklch(0.65 0.008 256);padding:16px">
       <div style="display:flex;gap:8px;align-items:baseline"><b style="font-size:16px">${esc(p.name)}<\/b>${p.url?`<span style="margin-left:auto;color:oklch(0.55 0.18 132)">↗<\/span>`:""}<\/div>
       <p style="font-size:13px;margin-top:6px;color:oklch(0.3 0.006 256)">${esc(p.desc||"")}<\/p>
       <p class="mono" style="font-size:10px;text-transform:uppercase;margin-top:10px;color:oklch(0.45 0.005 256)">${p.tags.join(" · ")}<\/p><\/div>`).join("")}
    <\/div>`);
  const tools=band(false,head("03","// ai components","Tools",`${S.tools.length} · ${priceMo(S.price)}`)+`
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px 40px" class="g2">${toolTableRows(false)}<\/div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:16px" class="small muted">
      <span><b class="sec2">Models (${S.models.length})<\/b> ${S.models.map(m=>esc(m.name)).join(", ")}<\/span>
      <span><b class="sec2">${esc(S.bundles[0].name)}<\/b> ${esc(S.bundles[0].tier)} · ${priceMo(S.bundles[0].amount)}<\/span><\/div>`);
  const guide=band(true,head("04","// writeup","Guide",guideMin+" min read",true)+`
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:32px" class="g2">
      <p style="font-size:17px;line-height:1.65">${esc(S.guide.firstp)} <b style="color:oklch(0.55 0.18 132)">read on →<\/b><\/p>
      <div style="border-left:2px solid oklch(0.55 0.18 132);padding-left:16px">${S.guide.heads.map(h=>`<p class="mono" style="font-size:13px;padding:4px 0">${esc(h)}<\/p>`).join("")}<\/div>

  const cta=`<section style="background:var(--lime);padding:24px;text-align:center"><b class="mono" style="color:var(--lime-contrast);text-transform:uppercase;letter-spacing:.14em;font-size:14px">Share your own stack →<\/b><\/section>`;
  return hero+usage+projects+tools+guide+cta+`<style>@media(max-width:820px){.g2{grid-template-columns:1fr!important}}<\/style>`;
}

/* =========================================================================

   deep data panel in a contrast box.
   ========================================================================= */
function renderV17(){
  const band=(bg,fg,pad,inner)=>`<section style="background:${bg};color:${fg};padding:${pad}px 24px">${inner}<\/section>`;
  const center=i=>`<div style="max-width:1080px;margin:0 auto">${i}<\/div>`;
  const giant=(t,sub)=>`<div class="mono" style="font-size:clamp(56px,11vw,140px);font-weight:900;line-height:.85;letter-spacing:-.04em;text-align:center">${t}<\/div><p class="mono" style="margin-top:12px;text-align:center;font-size:clamp(11px,1.6vw,15px);letter-spacing:.22em;text-transform:uppercase;opacity:.75">${sub}<\/p>`;
  const panel=(bg,fg,inner)=>`<div style="background:${bg};color:${fg};padding:22px;margin-top:30px;text-align:left">${inner}<\/div>`;
  return band("var(--bg-canvas)","var(--fg-primary)",52,center(`
      <p class="kick lime" style="text-align:center">aistack · stack<\/p>

      <p class="sec2" style="text-align:center;margin-top:12px;font-size:17px">${esc(S.oneLiner)}<\/p>
      <p class="small muted" style="text-align:center;margin-top:6px">${esc(S.creator.name)} @${esc(S.creator.handle)} · ${UP} 12<\/p>`))+
    band("var(--lime)","var(--lime-contrast)",52,center(
      giant(fmtT(U.totalTokens),`tokens in 30 days · ${fmtUSD(U.usd)} at list prices`)+
      `<div style="mix-blend-mode:multiply;max-width:840px;margin:20px auto 0">${spark(U.series,840,64).replace('var(--lime)','var(--lime-contrast)')}<\/div>`+
      panel("oklch(0.22 0.02 132)","oklch(0.96 0.01 132)",`
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 36px" class="g2">
          <div>${modelRows.map(m=>`<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid oklch(0.35 0.03 132)">
            ${modelIcn(m.name,20)}<b style="width:120px;font-size:13px">${esc(m.name)}<\/b>
            <span class="bar-track" style="height:8px;background:oklch(0.3 0.02 132)"><span class="bar-fill" style="width:${m.share*100}%"><\/span><\/span>
            <b class="mono small" style="width:44px;text-align:right">${pct(m.share,1)}<\/b><span class="mono small" style="width:56px;text-align:right;opacity:.7">${fmtUSD(m.usd)}<\/span><\/div>`).join("")}<\/div>
          <div style="display:flex;flex-direction:column;justify-content:space-between;gap:14px">${statStrip(false)}
            <div>${phaseStrip(14)}<\/div><\/div>
        <\/div>
        <p class="mono" style="font-size:10px;margin-top:12px;opacity:.6">${COST_NOTE}<\/p>`)))+
    band("var(--bg-canvas)","var(--fg-primary)",52,center(
      giant(`<span class="lime">${wfCells[0].fig}<\/span>`,"of events fall in the three busiest hours")+
      panel("var(--bg-shell)","var(--fg-primary)",`
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px 30px">
          ${wfCells.map(c=>`<div><div style="display:flex;gap:8px;align-items:baseline"><b class="mono lime" style="font-size:22px">${c.fig}<\/b><span class="small"><b>${c.name}<\/b><\/span><\/div>
            <p class="small muted" style="margin:2px 0 6px">${c.label}<\/p>${microViz(c.id,false)}<\/div>`).join("")}
        <\/div>`)))+
    band("oklch(0.95 0.005 256)","oklch(0.15 0.008 256)",52,center(
      giant(`<span style="color:oklch(0.55 0.18 132)">${price(S.price)}<\/span><span style="font-size:.32em">/mo<\/span>`,`${S.tools.length} tools · ${S.models.length} models · ${P.length} projects`)+
      panel("#fff","oklch(0.15 0.008 256)",`
        <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:10px 36px" class="g2">
          <div>${toolTableRows(true)}<\/div>
          <div>${projRowsDeep(true)}
            <p class="small" style="margin-top:10px;color:oklch(0.45 0.005 256)">Models: ${S.models.map(m=>esc(m.name)).join(", ")}<\/p><\/div>
        <\/div>`)))+
    band("var(--bg-shell)","var(--fg-primary)",44,center(`
      <p style="max-width:680px;margin:0 auto;font-size:19px;line-height:1.6;color:var(--fg-secondary);text-align:center">“${esc(S.guide.firstp.slice(0,200))}…”<\/p>
      <p class="mono lime" style="margin-top:12px;text-align:center;font-size:13px">${S.guide.heads.map(esc).join(" · ")} · ${guideMin} min →<\/p>`))+
    `<section style="background:var(--lime);padding:20px;text-align:center"><b class="mono" style="color:var(--lime-contrast);text-transform:uppercase;letter-spacing:.14em">Share your own stack →<\/b><\/section>
    <style>@media(max-width:820px){.g2{grid-template-columns:1fr!important}}<\/style>`;
}

/* =========================================================================
   V18 WINDOWS - editorial hero, then every section is a terminal window

<script>
/* PROTOTYPE - throwaway (ticket alp82/aistack#351). Round 4: six refinements
   of the winning v16 frame, one per axis the operator opened:
   tonal bands, usage hierarchy, v20 title rail, v17 lime accent panel,
   a usage timeline, and v25's distributed per-section stats. */
"use strict";

/* ---------- round-4 shared kit ---------- */
/* tonal band ladders: lightness tints of the canvas hue, no hard contrast */
const TINT4=["oklch(0.16 0.008 256)","oklch(0.185 0.009 256)","oklch(0.21 0.009 256)","oklch(0.185 0.009 256)"];
const TINT2=["oklch(0.16 0.008 256)","oklch(0.19 0.009 256)"];
const bandAt=(ladder,i)=>ladder[i%ladder.length];

/* v16-style numbered header (kept from the winner) */
const v16head=(n,kick,title,meta)=>`
  <div style="display:flex;align-items:flex-end;gap:16px;border-bottom:1px solid var(--stroke);padding-bottom:12px;margin-bottom:24px">
    ${NUM7(n)}
    <div style="flex:1"><p class="kick lime">${kick}<\/p>
    <h2 style="font-size:clamp(24px,3.4vw,34px);font-weight:900;text-transform:uppercase;letter-spacing:-.01em">${title}<\/h2><\/div>
    <span class="mono small muted">${meta||""}<\/span><\/div>`;

/* v20-style title rail: chapter number and title in a left rail */
const railSec=(bg,n,kick,title,meta,body)=>`
  <section style="background:${bg};padding:40px 0"><div style="max-width:1220px;margin:0 auto;padding:0 24px">
    <div style="display:grid;grid-template-columns:190px 1fr;gap:30px" class="rl2">
      <div><div class="mono" style="font-size:52px;font-weight:900;color:var(--lime);line-height:1">${n}<\/div>
        <p class="kick lime" style="margin-top:6px">${kick}<\/p>
        <h2 style="font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin-top:2px">${title}<\/h2>
        <p class="mono small muted" style="margin-top:10px">${meta||""}<\/p><\/div>
      <div style="min-width:0">${body}<\/div>
    <\/div><\/div><\/section>`;

/* v17's lime summary panel, sized as an accent block */
const limeSummary=()=>`
  <div style="background:var(--lime);color:var(--lime-contrast);padding:22px 24px">
    <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end">
      <div><div class="mono" style="font-size:clamp(44px,6vw,68px);font-weight:900;line-height:.9">${fmtT(U.totalTokens)}<\/div>
        <p class="mono" style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-top:4px;opacity:.75">tokens · 30 days<\/p><\/div>
      ${[[fmtUSD(U.usd),"spend ≥ list"],[num(U.sessions),"sessions"],[U.activeDays+"/30","active days"],[pct(U.cacheHitShare,1),"cache hits"]]
        .map(([v,k])=>`<div><div class="mono" style="font-weight:900;font-size:24px">${v}<\/div><div class="mono" style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.7">${k}<\/div><\/div>`).join("")}
    <\/div>
    <div style="mix-blend-mode:multiply;margin-top:10px">${spark(U.series,900,50).replace('var(--lime)','var(--lime-contrast)')}<\/div>
  <\/div>`;

/* hierarchy: the three highlight rows big, with their charts */
const podiumGrid=()=>`
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px">
  ${wfCells.slice(0,3).map(c=>`<div style="border-top:2px solid var(--lime);padding-top:10px">

    <p class="small muted" style="margin:3px 0 10px">${c.label}<\/p>${microViz(c.id,false)}<\/div>`).join("")}<\/div>`;

/* quick-scan one-liners for the tail measurements */
const scanRows=(cells)=>cells.map(c=>`
  <div style="display:flex;gap:12px;padding:6px 0;border-bottom:1px solid var(--stroke);align-items:baseline">

    <span class="small" style="min-width:0"><b>${c.name}<\/b> <span class="muted">· ${c.label}<\/span><\/span><\/div>`).join("");

/* styled drawer for the initially hidden tail */
const drawer=(label,inner)=>`
  <details style="margin-top:18px"><summary class="mono" style="cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:10px;border:1px solid var(--stroke);padding:9px 16px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--lime)">▸ ${label}<\/summary>
  <div style="margin-top:16px">${inner}<\/div><\/details>`;

/* the deep tail as a two-column chart grid */
const tailGrid=(cells)=>`
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px 30px">
  ${cells.map(c=>`<div><div style="display:flex;gap:8px;align-items:baseline"><b class="mono lime" style="font-size:20px">${c.fig}<\/b><span class="small"><b>${c.name}<\/b><\/span><\/div>
    <p class="small muted" style="margin:2px 0 6px">${c.label}<\/p>${microViz(c.id,false)}<\/div>`).join("")}<\/div>`;

/* usage timeline: the 30 days as an annotated horizontal history */
function usageTimeline(){
  const max=Math.max(...U.series.map(p=>p.t));
  const peak=U.series.reduce((a,b)=>b.t>a.t?b:a);
  const cols=U.series.map(p=>{
    const g=W.gitDays.find(x=>x.d===p.d);
    return `<div title="${p.d} · ${fmtT(p.t)} tokens${g?` · ${g.c} commits`:""}" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%">
      <span style="background:var(--lime);opacity:${0.3+0.7*p.t/max};height:${Math.max(2,p.t/max*72)}px"><\/span>
      <span style="background:var(--stroke-strong);height:${g?Math.max(1,g.c/40*16):1}px"><\/span><\/div>`;}).join("");
  return `
  <div style="border:1px solid var(--stroke);padding:18px 18px 12px">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px" class="mono small">

    <div style="display:flex;gap:24px;flex-wrap:wrap;margin-top:10px;border-top:1px solid var(--stroke);padding-top:10px" class="mono small">
      <span>vs the 30 days before: <b class="lime">${UP} tokens ×${(U.totalTokens/U.prevTokens).toFixed(0)}<\/b><\/span>
      <span class="muted">spend then ${fmtUSD(U.prevUsd)} → now ${fmtUSD(U.usd)}<\/span><\/div>
  <\/div>`;
}

/* project cards with integrated project-related stats (v25 idea) */
const projStatCards=()=>{
  const stats=[
    `<b class="mono lime">${rowVal(row("metric:parallel-projects"))}<\/b> in parallel on a median day`,
    `<b class="mono lime">${num(W.git.commits)}<\/b> commits · +${fmtT(W.git.add)} −${fmtT(W.git.rm)}`,
    `<b class="mono lime">${pct(W.git.test/W.git.commits)}<\/b> of commits touch a test file`,
    `<b class="mono lime">${W.langs[0].ext}<\/b> leads the changed lines at ${pct(W.langs[0].share)}`,
    `<b class="mono lime">${rowVal(row("metric:late-night-commits"))}<\/b> of commits land late night`,
    `<b class="mono lime">${num(U.projects)}<\/b> distinct workspaces touched`];
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px">
    ${P.map((p,i)=>`<div style="border:1px solid var(--stroke);padding:16px">
      <div style="display:flex;gap:8px;align-items:baseline"><b style="font-size:16px">${esc(p.name)}<\/b>${p.url?`<span class="lime" style="margin-left:auto">↗<\/span>`:""}<\/div>
      <p class="small sec2" style="margin-top:5px">${esc(p.desc||"")}<\/p>

<script>
/* PROTOTYPE - throwaway (ticket alp82/aistack#351). Round 5: the v27 frame
   locked (title rail, two shades, drawer), the original page's loved pieces
   back (metric block with watermark + fun facts, cost tooltip, the colored
   model breakdown with notches), and five treatments of the Stats interior. */
"use strict";

/* ---------- the originals, rebuilt ---------- */
const CHART=["#69a621","#9e71fd","#c21977","#4278d2","#00a99b","#e66700"];
const FRESH=U.tok?U.tok.input+U.tok.output:U.totalTokens*(1-U.cacheHitShare);
const CACHED=U.tok?U.tok.cacheRead:U.totalTokens*U.cacheHitShare;
const FACTS=(()=>{const words=U.totalTokens*0.75;return [
  `≈ ${num(words/90000)} novels' worth of words`,
  `≈ ${num(U.totalTokens*4/160/1e6)}M text messages at 160 characters`,
  `≈ ${num(words/885000)}× the complete works of Shakespeare`,
  `≈ ${num(words/238/60/24)} days of nonstop out-loud reading`,
];})();

/* metric block: watermark history, fun-fact flips on click, cost hover card */
function metricBlock(){
  const max=Math.max(...U.series.map(p=>p.t));
  const pts=U.series.map((p,i)=>`${(i/(U.series.length-1))*400},${96-(p.t/max)*92}`).join(" ");
  const area=`<svg width="100%" height="100%" viewBox="0 0 400 96" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,96 ${pts} 400,96" fill="var(--lime)"/><polyline points="${pts}" fill="none" stroke="var(--lime)" stroke-width="2"/><\/svg>`;
  const costRows=modelRows.map((m,i)=>`<div style="display:flex;gap:8px;justify-content:space-between;padding:2px 0"><span style="display:flex;gap:6px;align-items:center"><span style="width:8px;height:8px;background:${CHART[i%6]}"><\/span>${esc(m.name)}<\/span><b class="mono">${fmtUSD(m.usd)}<\/b><\/div>`).join("");
  return `
  <div style="position:relative">
    <div style="position:absolute;inset:0;overflow:hidden;opacity:.16;pointer-events:none">${area}<\/div>
    <div style="position:relative;padding:12px">
      <button type="button" onclick="this.querySelector('i').textContent=FACTS[(++this.dataset.i)%FACTS.length]" data-i="0" style="all:unset;cursor:pointer;display:block">
        <span class="mono" style="font-size:clamp(44px,5.4vw,60px);font-weight:900;line-height:1;display:block">${fmtT(U.totalTokens)}<\/span>
        <span class="kick muted" style="display:block;margin-top:8px">tokens · ${window.WIN_TXT||"last 30 days"}<\/span>
        <i class="mono small lime" style="display:block;font-style:normal;margin-top:4px">≈ tap for a fun fact<\/i>
      <\/button>
      <p class="mono small muted" style="margin-top:6px">${fmtT(FRESH)} fresh · ${fmtT(CACHED)} cached<\/p>
      <div class="hovh" style="position:relative;display:inline-block;margin-top:14px">
        <span class="mono" style="font-size:26px;font-weight:900;border-bottom:1px dotted var(--stroke-strong);cursor:help">≥${fmtUSD(U.usd)}<\/span>
        <span class="kick muted" style="display:block;margin-top:4px">at api list prices<\/span>
        <div class="hovc" style="position:absolute;left:0;top:100%;z-index:30;width:280px;background:var(--bg-shell);border:1px solid var(--stroke-strong);padding:12px;display:none">
          ${costRows}<p class="small muted" style="margin-top:8px;border-top:1px solid var(--stroke);padding-top:6px">${COST_NOTE}<\/p><\/div>
      <\/div>
      <p class="mono small" style="margin-top:12px"><span class="lime">${UP} ×${(U.totalTokens/U.prevTokens).toFixed(0)}<\/span> <span class="muted">vs the 30 days before<\/span><\/p>
    <\/div>
  <\/div>
  <style>.hovh:hover .hovc{display:block}<\/style>`;
}

/* the colored model breakdown with hatched was-here notches */
function modelBreakdown(){
  return `
  <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;margin-bottom:8px">
    <p class="kick lime">where the tokens went<\/p>
    <p class="mono small muted">the notch marks each share 30 days ago<\/p><\/div>
  <div style="border-top:1px solid var(--stroke);border-bottom:1px solid var(--stroke)">
  ${modelRows.map((m,i)=>{
    const paint=CHART[i%6];
    const moved=m.prevShare!=null&&Math.abs(m.prevShare-m.share)>0.02;
    const d=m.prevShare!=null?Math.round((m.share-m.prevShare)*100):null;
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:${i?`1px solid var(--stroke)`:"0"}">
      <span style="width:12px;height:12px;background:${paint};flex:none"><\/span>
      <span style="width:128px;flex:none;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name)}<\/span>
      <span style="position:relative;flex:1;height:28px;background:var(--bg-panel)" title="${esc(m.name)} · ${pct(m.share,1)} · ${fmtUSD(m.usd)} · ${fmtT(m.tokens)} tokens">
        <span style="position:absolute;inset:0 auto 0 0;width:${Math.max(1,m.share*100)}%;background:${paint}"><\/span>
        ${moved?`<span style="position:absolute;top:-3px;bottom:-3px;left:${m.prevShare*100}%;width:7px;transform:translateX(-50%);background:repeating-linear-gradient(45deg,#fff 0 2px,#000 2px 4px)"><\/span>`:""}
      <\/span>
      <b class="mono" style="width:52px;text-align:right;font-size:14px">${pct(m.share,1)}<\/b>
      <span class="mono small muted" style="width:34px;text-align:right">${d===null?"–":d>0?"↑"+d:d<0?"↓"+(-d):"–"}<\/span>
    <\/div>`;}).join("")}
  <\/div>`;
}

/* the top block both halves together, v27 two-column */
const statsTop=()=>`
  <div style="display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:34px" class="g2">
    <div>${metricBlock()}<\/div>
    <div>${modelBreakdown()}
      <div style="display:flex;gap:26px;flex-wrap:wrap;margin-top:14px" class="mono small muted">
        <span><b class="sec2">${num(U.sessions)}<\/b> sessions<\/span><span><b class="sec2">${U.activeDays}/30<\/b> days<\/span>
        <span><b class="sec2">${pct(U.cacheHitShare,1)}<\/b> cache hits<\/span><span><b class="sec2">${pct(U.subagentShare,1)}<\/b> subagent tokens<\/span>
        <span><b class="sec2">${U.harnessesLabel??"claude-code 61% · codex 39%"}<\/b><\/span><\/div>
    <\/div>
  <\/div>`;

/* the original five tab groups, as pure-CSS tabs */
const TOPIC5=[
  ["time","Time",["component:activity-heatmap","component:start-hours","metric:late-night-commits","component:phase-playbook","metric:turn-duration"]],
  ["code","Code",["component:git-ledger","component:coding-languages","metric:parallel-projects"]],
  ["models","Models",["component:model-routing","metric:effort-levels","metric:thinking-share"]],
  ["harness","Harness",["component:delegation","metric:question-back-share"]],
  ["skills","Skills",["component:kit","metric:web-searches-per-active-day"]]];
const cellsOf=list=>wfCells.filter(c=>list.includes(c.id));
function cssTabs(prefix){
  const radios=TOPIC5.map(([id],i)=>`<input type="radio" name="${prefix}" id="${prefix}-${id}" ${i===0?"checked":""} style="display:none">`).join("");
  const labels=`<div style="display:flex;flex-wrap:wrap;border-bottom:1px solid var(--stroke)">${TOPIC5.map(([id,t,l])=>`<label for="${prefix}-${id}" class="mono" style="padding:10px 16px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;color:var(--fg-muted)">${t} · ${cellsOf(l).length}<\/label>`).join("")}<\/div>`;
  const panels=TOPIC5.map(([id,,l])=>`<div class="tp tp-${prefix}-${id}" style="display:none;margin-top:20px">${tailGrid(cellsOf(l))}<\/div>`).join("");
  const css=`<style>${TOPIC5.map(([id])=>`#${prefix}-${id}:checked~div label[for="${prefix}-${id}"]{color:var(--lime);box-shadow:inset 0 -2px var(--lime)}#${prefix}-${id}:checked~.tp-${prefix}-${id}{display:block!important}`).join("")}<\/style>`;
  return `<div>${radios}${labels}${panels}${css}<\/div>`;
}

/* v27 frame pieces with the simple section names */
const frame5=(statsBody,statsMeta)=>{
  const hero=`<section style="background:${TINT2[0]};padding:44px 0"><div style="max-width:1220px;margin:0 auto;padding:0 24px">${heroV16()}<\/div><\/section>`;
  return hero+
    railSec(TINT2[1],"01","// sync","Stats",statsMeta??`30d · checked ${readCheckedAgo}`,statsBody)+
    railSec(TINT2[0],"02","// showcase","Projects",P.length+" projects",projGridV16())+
    railSec(TINT2[1],"03","// ai components","Tools",`${S.tools.length} · ${priceMo(S.price)}`,toolsBodyV16())+

/* =========================================================================

   scannable row inside small topic groups, each with its chart beside it.
   ========================================================================= */
function renderV36(){
  const groupRows=TOPIC5.map(([,t,l])=>{
    const cells=cellsOf(l); if(!cells.length) return "";
    return `<div style="margin-top:22px"><p class="kick muted" style="margin-bottom:6px">${t.toLowerCase()}<\/p>
      ${cells.map(c=>`<div style="display:grid;grid-template-columns:70px minmax(180px,240px) 1fr;gap:14px;align-items:center;padding:8px 0;border-bottom:1px solid var(--stroke)" class="sr3">

        <div style="min-width:0">${microViz(c.id,false)}<\/div><\/div>`).join("")}<\/div>`;}).join("");
  return frame5(statsTop()+groupRows+

<script>
/* PROTOTYPE - throwaway (ticket alp82/aistack#351). Round 6: one composed
   design (v37) on a steady spacing scale, with the Stats topics as accordion
   rows and live toggles: title style, band tints, section name, rows mode. */
"use strict";

/* OPTS is set by the template from URL params:
   {title:"rail"|"num", bands:"2"|"4", name:"stats"|"usage", rows:"acc"|"tabs"} */
const optDefaults={title:"rail",bands:"4",name:"stats",rows:"acc",top:"stack",exp:"feature"};
const OPT=k=>(window.OPTS&&window.OPTS[k])||optDefaults[k];

/* ---------- steady-rhythm section shell (both title styles) ---------- */
function sec37(i,n,kick,title,meta,body){
  const ladder=OPT("bands")==="4"?TINT4:TINT2;
  const bg=bandAt(ladder,i);
  if(OPT("title")==="num"){
    return `<section style="background:${bg};padding:48px 0"><div style="max-width:1280px;margin:0 auto;padding:0 24px">
      ${v16head(n,kick,title,meta)}${body}<\/div><\/section>`;
  }
  return `<section style="background:${bg};padding:48px 0"><div style="max-width:1280px;margin:0 auto;padding:0 24px">
    <div style="display:grid;grid-template-columns:170px 1fr;gap:40px" class="rl2">
      <div><div class="mono" style="font-size:48px;font-weight:900;color:var(--lime);line-height:1">${n}<\/div>
        ${kick?`<p class="kick lime" style="margin-top:8px">${kick}<\/p>`:""}
        <h2 style="font-size:21px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin-top:${kick?"2px":"10px"}">${title}<\/h2>
        <p class="mono small muted" style="margin-top:12px;line-height:1.7">${meta||""}<\/p><\/div>
      <div style="min-width:0">${body}<\/div>
    <\/div><\/div><\/section>`;
}

/* ---------- the five topic groups: summary row data ---------- */
function topicGroups(){
  const modelStrip=`<div style="display:flex;height:100%">${modelRows.map((m,i)=>`<span style="width:${m.share*100}%;background:${CHART[i%6]}"><\/span>`).join("")}<\/div>`;
  const delegStrip=`<div style="display:flex;height:100%"><span style="width:${row("component:delegation").value*100}%;background:var(--lime)"><\/span><span style="flex:1;background:var(--bg-panel-muted)"><\/span><\/div>`;
  const skillStrip=`<div style="display:flex;align-items:flex-end;gap:3px;height:100%">${W.skills.map(s=>`<span style="flex:1;background:var(--lime);height:${Math.max(8,s.share/W.skills[0].share*100)}%"><\/span>`).join("")}<\/div>`;
  return [
    {key:"time",label:"Time",cells:cellsOf(["component:activity-heatmap","component:start-hours","metric:late-night-commits","component:phase-playbook","metric:turn-duration"]),
     summary:`<b class="mono lime">${rowVal(row("component:phase-playbook"))}<\/b> median session · usual start <b class="mono">${rowVal(row("component:start-hours"))}<\/b> · <b class="mono">${rowVal(row("component:activity-heatmap"))}<\/b> of events in the 3 busiest hours`,
     bg:startHoursChart(46)},
    {key:"code",label:"Code",cells:cellsOf(["component:git-ledger","component:coding-languages","metric:parallel-projects"]),
     summary:`<b class="mono lime">${num(W.git.commits)}<\/b> commits · <b class="mono">+${fmtT(W.git.add)} −${fmtT(W.git.rm)}<\/b> lines · <b class="mono">${rowVal(row("metric:parallel-projects"))}<\/b> projects in parallel`,
     bg:gitBars(46)},
    {key:"models",label:"Models",cells:cellsOf(["component:model-routing","metric:effort-levels","metric:thinking-share"]),
     summary:`<b class="mono lime">${rowVal(row("component:model-routing"))}<\/b> of main-loop tokens on one model · <b class="mono">${rowVal(row("metric:effort-levels"))}<\/b> of turns at high effort`,
     bg:modelStrip},
    {key:"harness",label:"Harness",cells:cellsOf(["component:delegation","metric:question-back-share"]),
     summary:`<b class="mono lime">${rowVal(row("component:delegation"))}<\/b> of tool calls run in subagents · <b class="mono">${num(U.sessions)}<\/b> sessions on <b class="mono">${W.lead.harnesses}<\/b> harnesses`,
     bg:delegStrip},
    {key:"skills",label:"Skills",cells:cellsOf(["component:kit","metric:web-searches-per-active-day"]),
     summary:`<b class="mono lime">${esc(W.skills[0].name)}<\/b> leads at ${pct(W.skills[0].share)} of skill calls · <b class="mono">${rowVal(row("metric:web-searches-per-active-day"))}<\/b> web searches per active day`,
     bg:skillStrip},
  ];
}

/* the topic's lead chart, for the "feature" expanded format */
function leadChart(key){
  switch(key){
    case "time": return `<p class="kick muted" style="margin-bottom:8px">commits, hour × weekday<\/p>`+heatmap(12);
    case "code": return `<p class="kick muted" style="margin-bottom:8px">commits per day, 30 days<\/p>`+gitBars(64);
    case "models": return `<p class="kick muted" style="margin-bottom:8px">main-loop routing<\/p>`+microViz("component:model-routing",false);
    case "harness": return `<p class="kick muted" style="margin-bottom:8px">where tool calls run<\/p>`+microViz("component:delegation",false);
    case "skills": return `<p class="kick muted" style="margin-bottom:8px">skill calls<\/p>`+W.skills.slice(0,5).map(s=>barRow(s.name,s.share)).join("");
    default: return "";
  }
}

/* expanded content, three formats behind the exp knob */
function expBody(g){
  const exp=OPT("exp");
  if(exp==="feature")return `
    <div style="display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:34px" class="g2">
      <div>${leadChart(g.key)}<\/div>
      <div>${scanRows(g.cells)}<\/div>
    <\/div>`;
  if(exp==="rows")return g.cells.map(c=>`
    <div style="display:grid;grid-template-columns:76px minmax(180px,250px) 1fr;gap:18px;align-items:center;padding:10px 0;border-top:1px solid var(--stroke)" class="sr3">
      <b class="mono lime" style="font-size:20px;text-align:right">${c.fig}<\/b>
      <span class="small"><b>${c.name}<\/b><br><span class="muted">${c.label}<\/span><\/span>
      <div style="min-width:0">${microViz(c.id,false)}<\/div>
    <\/div>`).join("")+`<style>@media(max-width:760px){.sr3{grid-template-columns:60px 1fr!important}.sr3>div{grid-column:1/3}}<\/style>`;
  /* grid (default): equalized two-up cells with consistent chart slots */
  return `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px 34px">
    ${g.cells.map(c=>`<div style="cursor:help" title="${c.name}: ${c.fig} ${c.label}">
      <div style="display:flex;gap:10px;align-items:baseline"><b class="mono lime" style="font-size:22px">${c.fig}<\/b><span class="small"><b>${c.name}<\/b><\/span><\/div>
      <p class="small muted" style="margin:2px 0 8px">${c.label}<\/p>${microViz(c.id,false)}<\/div>`).join("")}<\/div>`;
}

/* accordion: one meaningful row per topic, history chart as the watermark.
   name= makes it exclusive natively; the template adds a toggle fallback. */
function statsAccordion(){
  return `<div style="border-top:1px solid var(--stroke)">${topicGroups().map(g=>`
    <details name="acc37" style="border-bottom:1px solid var(--stroke)">
      <summary style="list-style:none;cursor:pointer;position:relative;display:block">
        <div style="position:absolute;inset:6px 0;opacity:.14;pointer-events:none" aria-hidden="true">${g.bg}<\/div>
        <div style="position:relative;display:flex;align-items:center;gap:18px;padding:16px 4px;min-height:58px">
          <span class="mono" style="width:88px;flex:none;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lime)">${g.label}<\/span>
          <span class="small sec2" style="flex:1;min-width:0">${g.summary}<\/span>
          <span class="mono muted arr" style="flex:none">▾<\/span>
        <\/div>
      <\/summary>
      <div style="padding:8px 4px 26px 110px" class="accbody">${expBody(g)}<\/div>
    <\/details>`).join("")}<\/div>
  <style>details[open] .arr{transform:rotate(180deg)}@media(max-width:760px){.accbody{padding-left:4px!important}}<\/style>`;
}

/* ---------- the stats top block, four layouts behind the top knob ---------- */
const statChips=()=>`<div style="display:flex;gap:28px;flex-wrap:wrap" class="mono small muted">
  <span title="sessions in the range" style="cursor:help"><b class="sec2">${num(U.sessions)}<\/b> sessions<\/span>
  <span title="days with at least one session" style="cursor:help"><b class="sec2">${U.activeDays}/30<\/b> days<\/span>
  <span title="share of input tokens served from cache" style="cursor:help"><b class="sec2">${pct(U.cacheHitShare,1)}<\/b> cache hits<\/span>
  <span title="share of tokens spent by subagents" style="cursor:help"><b class="sec2">${pct(U.subagentShare,1)}<\/b> subagent tokens<\/span>
  <span title="token share by harness" style="cursor:help"><b class="sec2">claude-code 61% · codex 39%<\/b><\/span><\/div>`;

/* one-line headline strip: number, cost, delta on a single baseline */
function headlineStrip(){
  const max=Math.max(...U.series.map(p=>p.t));
  const pts=U.series.map((p,i)=>`${(i/(U.series.length-1))*400},${64-(p.t/max)*60}`).join(" ");
  return `
  <div style="position:relative;border:1px solid var(--stroke);padding:18px 20px">
    <div style="position:absolute;inset:0;overflow:hidden;opacity:.13;pointer-events:none" aria-hidden="true">
      <svg width="100%" height="100%" viewBox="0 0 400 64" preserveAspectRatio="none"><polygon points="0,64 ${pts} 400,64" fill="var(--lime)"/><\/svg><\/div>
    <div style="position:relative;display:flex;gap:30px;flex-wrap:wrap;align-items:baseline">
      <span class="mono" style="font-size:clamp(40px,4.6vw,54px);font-weight:900;line-height:1;cursor:pointer" title="tap for a fun fact"
        onclick="this.nextElementSibling.querySelector('i').textContent=FACTS[(++this.dataset.i)%FACTS.length]" data-i="0">${fmtT(U.totalTokens)}<\/span>
      <span><span class="kick muted">tokens · last 30 days<\/span><br><i class="mono small lime" style="font-style:normal">${fmtT(FRESH)} fresh · ${fmtT(CACHED)} cached<\/i><\/span>
      <span class="hovh" style="position:relative">
        <span class="mono" style="font-size:24px;font-weight:900;border-bottom:1px dotted var(--stroke-strong);cursor:help">≥${fmtUSD(U.usd)}<\/span>
        <span class="kick muted" style="display:block;margin-top:2px">at api list prices<\/span>
        <span class="hovc" style="position:absolute;left:0;top:100%;z-index:30;width:280px;background:var(--bg-shell);border:1px solid var(--stroke-strong);padding:12px;display:none">
          ${modelRows.map((m,i)=>`<span style="display:flex;gap:8px;justify-content:space-between;padding:2px 0"><span style="display:flex;gap:6px;align-items:center"><span style="width:8px;height:8px;background:${CHART[i%6]}"><\/span>${esc(m.name)}<\/span><b class="mono">${fmtUSD(m.usd)}<\/b><\/span>`).join("")}
          <span class="small muted" style="display:block;margin-top:8px;border-top:1px solid var(--stroke);padding-top:6px">${COST_NOTE}<\/span><\/span><\/span>
      <span class="mono small" style="margin-left:auto"><span class="lime">${UP} ×${(U.totalTokens/U.prevTokens).toFixed(0)}<\/span> <span class="muted">vs the 30 days before<\/span><\/span>
    <\/div>
  <\/div>`;
}

function statsTop37(){
  const top=OPT("top");
  if(top==="stack")return headlineStrip()+
    `<div style="margin-top:28px">${modelBreakdown()}<\/div><div style="margin-top:16px">${statChips()}<\/div>`;
  if(top==="merged")return `
    <div style="border:1px solid var(--stroke)">
      ${headlineStrip().replace('border:1px solid var(--stroke);','border:0;border-bottom:1px solid var(--stroke);')}
      <div style="padding:18px 20px">${modelBreakdown()}<\/div>
      <div style="border-top:1px solid var(--stroke);padding:12px 20px">${statChips()}<\/div>
    <\/div>`;
  if(top==="hero")return `
    <div>${metricBlock()}<\/div>
    <div style="margin-top:10px">${statChips()}<\/div>
    <div style="margin-top:28px">${modelBreakdown()}<\/div>`;
  /* side (default): matched heights, breakdown owns the right column */
  return `
  <div style="display:grid;grid-template-columns:minmax(0,330px) 1fr;gap:40px;align-items:stretch" class="g2">
    <div style="display:flex;flex-direction:column;justify-content:space-between">${metricBlock()}<\/div>
    <div style="display:flex;flex-direction:column;justify-content:space-between">
      <div>${modelBreakdown()}<\/div>
      <div style="margin-top:16px">${statChips()}<\/div>
    <\/div>
  <\/div>`;
}

/* =========================================================================
   V37 COMPOSED - one design. Steady 48px section rhythm, aligned columns,
   accordion (or tabs) below the top block, four live toggles in the top bar.
   ========================================================================= */
function renderV37(){
  const name=OPT("name")==="usage"?"Actual Usage":"Stats";
  const rows=OPT("rows")==="tabs"?`<div style="margin-top:36px">${cssTabs("t37")}<\/div>`:`<div style="margin-top:36px">${statsAccordion()}<\/div>`;
  const hero=`<section style="background:${(OPT("bands")==="4"?TINT4:TINT2)[0]};padding:48px 0 40px"><div style="max-width:1280px;margin:0 auto;padding:0 24px">${heroV16()}<\/div><\/section>`;
  return hero+
    sec37(1,"01","// sync",name,`30d · all machines<br>checked ${readCheckedAgo}`,statsTop37()+rows)+
    sec37(2,"02","// showcase","Projects",P.length+" projects",projGridV16())+
    sec37(3,"03","// ai components","Tools",`${S.tools.length} tools · ${priceMo(S.price)}`,toolsBodyV16())+
    sec37(0,"04","// writeup","Guide",guideMin+" min read",guideBodyV16())+
    ctaStrip()+MEDIA_G2;
}

<script>
/* PROTOTYPE - throwaway (ticket alp82/aistack#352). Round 1: three hero and
   subnav pairs, each rendered over the accepted v37 body from #351. The body
   is unchanged; only the top of the page and the section navigation differ.

   v38 Masthead + tabs   identity left, two promise tiles right (authored price,
                         measured tokens), logo strip; sticky tab bar with the
                         four section stats, identity appears once stuck.
   v39 Figures first     the four section figures ARE the hero, each a link;
                         the one-liner follows; a vertical progress rail on wide
                         screens, a sticky figure strip everywhere else.
   v40 Contents          name and one-liner left, a "in this stack" ladder
                         right with one sentence per section; a reading scrubber
                         pinned under the header, segments sized by section. */
"use strict";

const UPVOTES=12; // not in slim.json; the demo's stand-in, as in heroV16

/* The four sections of the v37 body, with the anchor ids body352() stamps. */
function sections352(){
  return [
    {n:"01",id:"s-stats",title:OPT("name")==="usage"?"Actual Usage":"Stats",stat:`${fmtT(U.totalTokens)} tokens`,
     line:`${fmtT(U.totalTokens)} tokens in 30 days, ${num(U.sessions)} sessions on ${W.lead.harnesses} harnesses`},
    {n:"02",id:"s-projects",title:"Projects",stat:`${P.length} projects`,
     line:`${P.length} projects, ${num(W.git.commits)} commits in the last 30 days`},
    {n:"03",id:"s-tools",title:"Tools",stat:`${S.tools.length} tools · ${priceMo(S.price)}`,
     line:`${S.tools.length} tools for ${priceMo(S.price)}, ${esc(toolsSorted[0].name)} and ${esc(toolsSorted[1].name)} cost the most`},
    {n:"04",id:"s-guide",title:"Guide",stat:`${guideMin} min read`,
     line:`${num(S.guide.words)} words by ${esc(S.creator.name.split(" ")[0])}, ${guideMin} min read`},
  ];
}

/* The v37 body (everything under the hero), with an id on each section. */
function body352(){
  const name=OPT("name")==="usage"?"Actual Usage":"Stats";
  const rows=OPT("rows")==="tabs"?`<div style="margin-top:36px">${cssTabs("t37")}<\/div>`:`<div style="margin-top:36px">${statsAccordion()}<\/div>`;
  const ids=["s-stats","s-projects","s-tools","s-guide"];
  let i=0;
  const html=sec37(1,"01","",name,`${OPT("win")} · all machines<br>updated ${readCheckedAgo}`,statsTop37()+rows)+
    sec37(2,"02","","Projects",P.length+" projects",projGridV16())+
    sec37(3,"03","","Tools",`${S.tools.length} tools · ${priceMo(S.price)}`,toolsBodyV16())+
    sec37(0,"04","","Guide",guideMin+" min read",guideBodyV16());
  return html.replace(/<section /g,()=>`<section id="${ids[i++]}" `)+ctaStrip()+MEDIA_G2+
    `<style>[id^="s-"]{scroll-margin-top:calc(var(--ptop,0px) + 88px)}<\/style>`;
}

/* shared identity bits */
const avatar352=px=>`<img src="${S.creator.avatar}" alt="" width="${px}" height="${px}" style="display:block;object-fit:cover;flex:none">`;
const byline352=()=>`<span class="mono small"><b class="sec2">${esc(S.creator.name)}<\/b> <span class="muted">@${esc(S.creator.handle)}<\/span><\/span><span class="small lime">✓ verified<\/span>`;
const actions352=()=>`<span class="chip" style="cursor:pointer">▲ ${UPVOTES}<\/span><span class="chip" style="cursor:pointer">Share<\/span><span class="chip" style="cursor:pointer">Report<\/span>`;

/* =========================================================================
   V38 MASTHEAD + TABS
   ========================================================================= */
function heroA(){
  const sec=sections352();
  const shown=S.tools.length<=6?S.tools.length:5;
  const act=OPT("act"), rule=OPT("rule"), lbl=OPT("lbl"), nav=OPT("nav");
  const hair="1px solid oklch(0.55 0.01 256 / 0.25)";
  const ruleCss=rule==="line"?"border-top:1px solid var(--stroke)":rule==="dim"?`border-top:${hair}`:rule==="dim2"?`border-top:${hair};border-bottom:${hair};padding-bottom:20px`:"";
  const label=lbl==="runs on"?"runs on":lbl==="tools"?`${S.tools.length} tools`:"";
  /* the three actions, arranged by importance: upvote > share > report */
  const btnUp=`<button class="ha-up" type="button"><span class="tri">▲<\/span> Upvote <b>${UPVOTES}<\/b><\/button>`;
  const btnShare=`<button class="ha-ghost" type="button">Share<\/button>`;
  const lnkReport=`<a class="ha-quiet" href="#">Report<\/a>`;

/* ---------- scroll behavior, wired after every render by the template ---------- */
window.afterRender=function(){
  if(window._nav352)window._nav352();
  window._nav352=null;
  const ptopOf=()=>{const h=document.getElementById("proto-head").offsetHeight;document.documentElement.style.setProperty("--ptop",h+"px");return h;};
  ptopOf();
  const spyLinks=[...document.querySelectorAll("[data-spy]")];
  if(!spyLinks.length)return;
  const ids=[...new Set(spyLinks.map(a=>a.dataset.spy))];
  const secs=ids.map(id=>document.getElementById(id)).filter(Boolean);
  const hero=document.querySelector("#page > section");
  const onScroll=()=>{
    const ptop=ptopOf();
    const line=scrollY+innerHeight*0.3;
    let cur=null;
    for(const s of secs){if(s.offsetTop<=line)cur=s.id;}
    spyLinks.forEach(a=>{if(!a.classList.contains("ha-tab"))a.classList.toggle("on",a.dataset.spy===cur);});
    const heroGone=hero.getBoundingClientRect().bottom<ptop;
    const tabs=document.getElementById("ha-tabs");
    if(tabs){tabs.classList.toggle("stuck",tabs.getBoundingClientRect().top<=ptop+1);
      const vpTop=scrollY+ptop+tabs.offsetHeight,vpBot=scrollY+innerHeight;
      tabs.querySelectorAll(".ha-tab").forEach(a=>{const s=document.getElementById(a.dataset.spy);if(!s)return;
        const st=Math.min(1,Math.max(0,(vpTop-s.offsetTop)/s.offsetHeight)),en=Math.min(1,Math.max(0,(vpBot-s.offsetTop)/s.offsetHeight));
        const vis=a.querySelector(".vis");vis.style.left=(st*100).toFixed(1)+"%";vis.style.width=`calc(${(Math.max(0,en-st)*100).toFixed(1)}%${en>=1&&st<1?" + 1px":""})`;
        const px=Math.max(0,en-st)*s.offsetHeight;a.classList.toggle("on",px/s.offsetHeight>=.5||px/(vpBot-vpTop)>=.5);});}
    const rail=document.getElementById("hb-rail");
    if(rail){rail.classList.toggle("shown",heroGone);const p=scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight);document.getElementById("hb-fill").style.height=(p*100).toFixed(1)+"%";}
    const bar=document.getElementById("hc-bar");
    if(bar){bar.classList.toggle("shown",heroGone);
      secs.forEach(s=>{const seg=bar.querySelector(`[data-seg="${s.id}"]`);if(!seg)return;seg.style.flexGrow=Math.max(1,s.offsetHeight/100);
        const f=Math.min(1,Math.max(0,(line-s.offsetTop)/s.offsetHeight));seg.querySelector(".fill").style.width=(f*100).toFixed(1)+"%";});}
  };
  /* the title fitter: one line when the font stays above MIN, else two lines */
  const fitTitle=()=>{
    const h1=document.querySelector(".ha-h1");if(!h1)return;
    const MAX=Math.min(88,Math.max(44,innerWidth*0.07)),MIN=44;
    h1.style.whiteSpace="nowrap";h1.style.fontSize=MAX+"px";
    const w=h1.parentElement.clientWidth,sw=h1.scrollWidth;
    const one=Math.min(MAX,MAX*w/sw);
    if(one>=MIN){h1.style.fontSize=one+"px";return;}
    h1.style.whiteSpace="normal";
    let s=MAX;h1.style.fontSize=s+"px";
    while(h1.offsetHeight>2*s*.88*1.05&&s>MIN){s-=2;h1.style.fontSize=s+"px";}
  };
  fitTitle();onScroll();
  const onResize=()=>{fitTitle();onScroll();};
  addEventListener("scroll",onScroll,{passive:true});addEventListener("resize",onResize);
  window._nav352=()=>{removeEventListener("scroll",onScroll);removeEventListener("resize",onResize);};
};

</script>
<script>
/* ---------- switcher ---------- */
const VARIANTS=[["base","Baseline (today)"],["v1","V1 Tight editorial"],["v2","V2 Ledger"],["v3","V3 Mosaic"],["v4","V4 Split rail"],["v5","V5 Digest"],["v6","V6 Magazine"],["v7","V7 Terminal"],["v8","V8 Bento"],["v9","V9 Billboard"],["v10","V10 Blueprint"],["v11","V11 Receipt"],["v12","V12 Ticker"],["v13","V13 Spine"],["v14","V14 Rails"],["v15","V15 Split hero"],["v16","V16 Magazine deep"],["v17","V17 Billboard data"],["v18","V18 Windows"],["v19","V19 Blueprint ed."],["v20","V20 Dossier"],["v21","V21 Chapters"],["v22","V22 Mural"],["v23","V23 Console pro"],["v24","V24 Feature table"],["v25","V25 Story scroll"],["v26","V26 Tonal 4"],["v27","V27 Rail + drawer"],["v28","V28 Distributed"],["v29","V29 Timeline"],["v30","V30 Quiet drawers"],["v31","V31 One moment"],["v32","V32 Simple+details"],["v33","V33 Tabs"],["v34","V34 Distributed"],["v35","V35 Two level"],["v36","V36 Grouped scan"],["v37","V37 Composed"],["v38","V38 Masthead + tabs"],["v39","V39 Figures first"],["v40","V40 Contents + scrubber"]];
const RENDER={base:renderBaseline,v1:renderV1,v2:renderV2,v3:renderV3,v4:renderV4,v5:renderV5,v6:renderV6,v7:renderV7,v8:renderV8,v9:renderV9,v10:renderV10,v11:renderV11,v12:renderV12,v13:renderV13,v14:renderV14,v15:renderV15,v16:renderV16,v17:renderV17,v18:renderV18,v19:renderV19,v20:renderV20,v21:renderV21,v22:renderV22,v23:renderV23,v24:renderV24,v25:renderV25,v26:renderV26,v27:renderV27,v28:renderV28,v29:renderV29,v30:renderV30,v31:renderV31,v32:renderV32,v33:renderV33,v34:renderV34,v35:renderV35,v36:renderV36,v37:renderV37,v38:renderV38,v39:renderV39,v40:renderV40};
const page=document.getElementById("page");
const heights={};
function measureAll(){
  readOpts();
  const probe=document.createElement("div");
  probe.style.cssText=`position:absolute;left:-99999px;top:0;width:${page.clientWidth||document.body.clientWidth}px`;
  document.body.appendChild(probe);
  for(const [k] of VARIANTS){probe.innerHTML=RENDER[k]();heights[k]=probe.scrollHeight;}
  probe.remove();
}
const KNOBS=[["title",["rail","num"]],["bands",["4","2"]],["name",["stats","usage"]],["rows",["acc","tabs"]],["top",["stack","side","merged","hero"]],["exp",["feature","grid","rows"]],["act",["tile","stacked","corner","chips"]],["rule",["none","dim2","dim","line"]],["lbl",["none","runs on","tools"]],["nav",["quiet","bare","lines"]],["win",["30d","7d","24h"]]];
const KNOBS_352=["act","rule","lbl","nav"]; // win is set by the page's own dropdown
function readOpts(){const p=new URLSearchParams(location.search);window.OPTS={};for(const [k,vals]of KNOBS)window.OPTS[k]=vals.includes(p.get(k))?p.get(k):vals[0];window.WIN_TXT={"30d":"last 30 days","7d":"last 7 days","24h":"last 24 hours"}[window.OPTS.win];}
function current(){const v=new URLSearchParams(location.search).get("v");return RENDER[v]?v:"v38";}
function show(k,push){
  readOpts();
  page.innerHTML=RENDER[k]();
  if(window.afterRender)afterRender();
  if(push){const u=new URL(location);u.searchParams.set("v",k);history.replaceState(null,"",u);}
  const bar=document.getElementById("switcher");
  const more=sessionStorage.getItem("more352")==="1";
  const vBtns=VARIANTS.map(([id,label])=>`<button class="${id===k?"on":""}" data-v="${id}" title="${label}">${label.split(" ")[0].replace("Baseline","Base")}</button>`).join("");
  const knobBtn=([key,vals])=>{const cur=window.OPTS[key];const next=vals[(vals.indexOf(cur)+1)%vals.length];return `<button class="knob" data-k="${key}" data-next="${next}" style="border-left:1px solid var(--stroke);color:var(--lime)">${key}: ${cur}</button>`;};
  const mine=KNOBS.filter(([key])=>KNOBS_352.includes(key)), old=KNOBS.filter(([key])=>!KNOBS_352.includes(key));
  bar.innerHTML=`<button id="more352" title="show every variant and the v37 toggles">${more?"less":"…"}</button>`+
    (more?vBtns+old.map(knobBtn).join(""):`<span class="h" style="border:0">${k}</span>`)+
    (/^v(37|38|39|40)$/.test(k)?mine.map(knobBtn).join(""):"")+
    `<button class="knob" style="border-left:1px solid var(--stroke)" title="open this variant in a 390px window" onclick="open(location.href,'m352','width=390,height=780')">📱 390</button><span class="h" id="hread"></span>`;
  document.getElementById("more352").onclick=()=>{sessionStorage.setItem("more352",more?"0":"1");show(k,false);};
  bar.querySelectorAll("button[data-v]").forEach(b=>b.onclick=()=>show(b.dataset.v,true));
  bar.querySelectorAll("button.knob").forEach(b=>b.onclick=()=>{const u=new URL(location);u.searchParams.set(b.dataset.k,b.dataset.next);history.replaceState(null,"",u);show(k,false);});
  const hn=document.getElementById("hnote");
  const label=VARIANTS.find(v=>v[0]===k)[1];
  const ratio=heights.base?Math.round(heights[k]/heights.base*100):null;
  document.getElementById("hread").textContent=ratio?`${label} · ${ratio}% of baseline height`:label;
  hn.textContent=ratio?`${Math.round(heights[k]/100)/10}k px vs baseline ${Math.round(heights.base/100)/10}k px`:"";
  const y=Number(new URLSearchParams(location.search).get("y")||0);
  window.scrollTo(0,y);
}
addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  const i=VARIANTS.findIndex(v=>v[0]===current());
  if(e.key==="ArrowRight")show(VARIANTS[(i+1)%VARIANTS.length][0],true);
  if(e.key==="ArrowLeft")show(VARIANTS[(i+VARIANTS.length-1)%VARIANTS.length][0],true);
});
measureAll();
show(current(),false);
addEventListener("resize",()=>{measureAll();show(current(),false);});
document.addEventListener("toggle",e=>{const d=e.target;if(d.tagName==="DETAILS"&&d.getAttribute("name")&&d.open){document.querySelectorAll(`details[name="${d.getAttribute("name")}"]`).forEach(o=>{if(o!==d)o.open=false;});}},true);
</script>
</body>
