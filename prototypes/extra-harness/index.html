<!doctype html><html><head><meta charset="utf-8"><title>#293 extra harness treatments</title>
<style>
:root{--bg-canvas:oklch(0.16 0.008 256);--bg-panel:oklch(0.2 0.009 256);--fg-primary:oklch(0.96 0.004 256);--fg-secondary:oklch(0.82 0.004 256);--fg-muted:oklch(0.68 0.005 256);--stroke-subtle:oklch(0.55 0.01 256 / 0.75);--source-1:oklch(0.92 0.004 256);--source-2:oklch(0.72 0.006 256);--source-3:oklch(0.54 0.008 256)}
.light{--bg-canvas:oklch(0.97 0.003 256);--bg-panel:oklch(1 0 0);--fg-primary:oklch(0.15 0.008 256);--fg-secondary:oklch(0.3 0.006 256);--fg-muted:oklch(0.45 0.005 256);--stroke-subtle:oklch(0.65 0.008 256 / 0.9);--source-1:oklch(0.22 0.008 256);--source-2:oklch(0.42 0.006 256);--source-3:oklch(0.6 0.004 256)}
body{margin:0;font-family:Inter,system-ui,sans-serif;display:grid;grid-template-columns:1fr 1fr}
.theme{background:var(--bg-canvas);color:var(--fg-primary);padding:32px 40px}
.mono{font-family:ui-monospace,Menlo,monospace}
h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-muted);margin:0 0 8px}
.v{margin-bottom:36px}.v h3{margin:0 0 10px;font-size:12px;color:var(--fg-primary)}.v h3 b{font-family:ui-monospace,monospace;margin-right:8px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--stroke-subtle);border-bottom:1px solid var(--stroke-subtle);width:520px}
li{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--stroke-subtle)}li:first-child{border-top:0}
.lbl{width:160px;font-size:14px;color:var(--fg-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:12px;flex:1;background:var(--bg-panel)}.bar{display:block;height:100%}
.pct{width:56px;text-align:right;font-family:ui-monospace,monospace;font-size:12px;font-weight:700;color:var(--fg-secondary)}
.tok{width:56px;text-align:right;font-family:ui-monospace,monospace;font-size:11px;color:var(--fg-muted)}
.dim{opacity:.5}
.hollow{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--p)}
.hatch{background:repeating-linear-gradient(135deg,var(--p) 0 3px,transparent 3px 6px)!important}
.mutelbl{font-family:ui-monospace,monospace;font-size:12px;color:var(--fg-muted)}
</style></head><body>
<script>
const rows=[["Claude Code",.71,"4.70B",true,1],["Codex",.24,"1.60B",false,2],["opencode",.05,"330M",false,3]];
const variants=[["A","Dimmed row: label and bar at half opacity, figures untouched",
 r=>`<span class="lbl${r[3]?' dim':''}">${r[0]}</span><span class="track${r[3]?' dim':''}"><span class="bar" style="width:${r[1]*100}%;background:var(--source-${r[4]})"></span></span>`],
 ["B","Hollow bar: the bar is an outline of its own paint with no fill",
 r=>`<span class="lbl">${r[0]}</span><span class="track"><span class="bar${r[3]?' hollow':''}" style="--p:var(--source-${r[4]});width:${r[1]*100}%;background:var(--source-${r[4]})"></span></span>`],
 ["C","Hatched bar: diagonal stripes of its own paint, label in muted mono",
 r=>`<span class="${r[3]?'lbl mutelbl':'lbl'}">${r[0]}</span><span class="track"><span class="bar${r[3]?' hatch':''}" style="--p:var(--source-${r[4]});width:${r[1]*100}%;background:var(--source-${r[4]})"></span></span>`]];
for(const theme of ["dark","light"]){document.write(`<div class="theme ${theme}"><h2>${theme} · Claude Code is the extra harness</h2>`);
 for(const [k,name,f] of variants){document.write(`<div class="v"><h3><b>${k}</b>${name}</h3><ul>`);
  for(const r of rows)document.write(`<li>${f(r)}<span class="pct">${(r[1]*100).toFixed(1)}%</span><span class="tok">${r[2]}</span></li>`);
  document.write(`</ul></div>`)} document.write(`</div>`)}
</script></body></html>
