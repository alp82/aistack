<!doctype html>
<!--
  PROTOTYPE - alp82/aistack#235 - throwaway, never production code.

  Plan: three variants of the news inbox, switchable from a floating bottom
  bar, all over the SAME real week of items. The 194 items were collected on
  2026-08-23 from the 14 phase-1 feeds through the real parser in
  convex/lib/feed.ts (see collect.ts next to this file). One source failure
  is simulated, because all 14 polls succeeded that day.

  Variants:
    A - Triage list: dense day-grouped rows, verdict per row, editor on tap.
    B - Focus queue: one item at a time, big verdict buttons, edit in place.
    C - Source digest: grouped by source, bulk discard, firehose contained.

  State is in memory only. Reload resets everything.
-->

licenseClass":"article","bodyText":"Sub2API is an open-source, self-hosted gateway for pooling Claude, OpenAI, Gemini, Grok, and other AI subscriptions behind unified API keys, billing, scheduling, and usage controls. Its latest release adds adaptive protocols and more granular service-level and context pricing."},{"headline":"PromptOT Treats Prompts Like Production Code","url":"https://aicrier.com/post/qedtsmp916b9yt1lor1t","publishedAt":1787434431000,"collectedAt":1787445231000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"PromptOT gives teams typed prompt blocks, version history, evaluations, environment-specific deployments, and one-click rollback through an API. It addresses a growing AI engineering problem: changing production prompts can alter behavior as dramatically as changing code."},{"headline":"0.150.0-alpha.7","url":"https://github.com/openai/codex/releases/tag/rust-v0.150.0-alpha.7","publishedAt":1787434183000,"collectedAt":1787444983000,"sourceName":"codex releases","intake":"feed","licenseClass":"permissive-release-notes","bodyText":"Release 0.150.0-alpha.7"},{"headline":"Quoting Linus Torvalds","url":"https://simonwillison.net/2026/Aug/22/linus-torvalds/","publishedAt":1787432666000,"collectedAt":1787443466000,"sourceName":"Simon Willison","intake":"feed","licenseClass":"article","bodyText":"And this was a debug session from hell, enormously helped by an AI doing much of the grunt-work.\n\nI'd like to call it my tireless helper, but the AI several times stated flat out that this was impossible and unsolvable and that we should just write a report about it.\n\nI suspect t"},{"headline":"Notion Agents Make Databases Self-Maintaining","url":"https://aicrier.com/post/bar8dc6krwy49fe9p0jm","publishedAt":1787431486000,"collectedAt":1787442286000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Notion’s AI agents can read business context, execute work, and update databases automatically, reducing the need for teams to manually maintain their workspace. The result is a shift from Notion as a documentation tool to an operational system run through agents."},{"headline":"Linear report maps AI’s output shift","url":"https://aicrier.com/post/cohvd7agti5qc4pvkzlo","publishedAt":1787429677000,"collectedAt":1787440477000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Linear’s first product-development data report finds coding-agent teams shipping roughly three times as many weekly pull requests, while AI now authors nearly half of new issues. The added output has not reduced coordination work, which remains steady or increases across teams."},{"headline":"0.149.0-alpha.7.2","url":"https://github.com/openai/codex/releases/tag/rust-v0.149.0-alpha.7.2","publishedAt":1787428322000,"collectedAt":1787439122000,"sourceName":"codex releases","intake":"feed","licenseClass":"permissive-release-notes","bodyText":"Release 0.149.0-alpha.7.2"},{"headline":"Google Antigravity Remote Control Reaches Every Screen","url":"https://aicrier.com/post/c11e5xhnrvioom3hhelv","publishedAt":1787427973000,"collectedAt":1787438773000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Google Antigravity’s Remote Control feature lets developers monitor and drive desktop agent sessions from any web browser, including iPads, VR headsets, and even Tesla browsers. Paired with Gemini 3.7 Flash, it turns long-running coding tasks into portable, always-accessible work"},{"headline":"Iterator.zip Brings Native Data Alignment","url":"https://aicrier.com/post/75g6m45whxqh4y06bnpf","publishedAt":1787422488000,"collectedAt":1787433288000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"TC39’s Joint Iteration proposal adds native `Iterator.zip` and `Iterator.zipKeyed` methods for combining iterables positionally or by key. Shortest, longest, and strict modes cover common alignment patterns without utility libraries."},{"headline": m emb"},{"headline":"Claude Code Users Flag Hidden Effort Cuts","url":"https://aicrier.com/post/sdxp2a9gapj80q9gdund","publishedAt":1787417929000,"collectedAt":1787428729000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Developers report that recent Claude Code builds may silently map the same effort labels to substantially smaller reasoning budgets. Independent tests suggest the change could reduce performance on complex refactors while preserving identical UI settings."},{"headline":"plan-and-execute orchestrates fresh subagents","url":"https://aicrier.com/post/b5ru5k8hq6mdqhp6ces9","publishedAt":1787416466000,"collectedAt":1787427266000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Matt Pocock’s open-source plan-and-execute skill breaks approved work into sequential scopes, dispatches fresh subagents for each stage, and passes results through a shared baton to a final verifier."},{"headline":"FreeToken Makes Frontier MoE More Local","url":"https://aicrier.com/post/thwsj418wpvbgu8xa5nv","publishedAt":1787416437000,"collectedAt":1787427237000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"FreeToken is an edge-native MoE serving system that combines GPU, CPU, and system RAM, dynamically caching and executing experts across available hardware. Its paper reports support for models up to 753B parameters, while demonstrating a 35B model on an 8GB laptop GPU."},{"headline":"Active Inference Reframes AI Agent Context","url":"https://aicrier.com/post/0897vs4rekcg1olk69xf","publishedAt":1787415902000,"collectedAt":1787426702000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"This research paper frames agent reliability as a context-acquisition problem: agents should decide when to ask, retrieve, call tools, or act under uncertainty. Its active-inference framework balances information gain against token and latency costs."},{"headline":"MCP Roadmap Puts Agents s found 14 functional npm packages that secretly delivered the RedC2 4.0 Linux backdoor when imported, including through transitive dependencies. Its AI-assisted command interface lowers the barrier for attackers operating inside developer environments."},{"headline":"NEXUS AI Targets Governed Enterprise Vibe Coding","url":"https://aicrier.com/post/ghq6lfianxpo8eruhi85","publishedAt":1787405190000,"collectedAt":1787415990000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"NEXUS AI gives teams a governed path from natural-language app generation to production, provisioning databases, secrets, storage, domains, and workers inside their own cloud accounts. Its enterprise pitch centers on audit logs, human-reviewed schema changes, scoped credentials, "},{"headline":"Anthropic Reconsiders Frontier-Model Data Retention","url":"https://aicrier.com/post/hd8fza19qc9zglwkj95o","publishedAt":1787405129000,"collectedAt":1787415929000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Anthropic plans to let enterprise customers retain data for 30 days on their own cloud infrastructure while using advanced Claude models. The shift follows OpenAI’s zero-data-retention pledge and addresses concerns over sensitive business data."},{"headline":"SGLang Makes Model Restarts Nearly Instant","url":"https://aicrier.com/post/7rclljvf76hnd8gnfey0","publishedAt":1787404320000,"collectedAt":1787415120000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"SGLang’s Weight Cache Daemon keeps post-quantized, tensor-parallel model weights resident in GPU memory and remaps them into replacement engines through CUDA IPC. Reported tests cut cached weight loading from roughly 495 seconds to 0.63 seconds."},{"headline":"TanStack AI Enters Release Candidate Phase","url":"https://aicrier.com/post/10sq3nrijjua55xyq346","publishedAt":1787401858000,"collectedAt":1787412658000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"TanStack AI enters release candidate status with its architecture locked around 24 providers, AG-UI interoperability, multimodal generation, MCP, sandboxed execution, and persistence. The open-source, framework-agnostic toolkit is positioning itself as a serious alternative to mo"},{"headline":"Benchy Tests LLMs Where Benchmarks Break","url":"https://aicrier.com/post/jjn1k87y3lywdlkewsrd","publishedAt":1787400871000,"collectedAt":1787411671000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Benchy is an open-source tool for comparing LLM quality, speed, and cost across practical workloads and hardware. It emphasizes failure modes such as malformed JSON and unreliable tool calling over simplistic overall rankings."},{"headline":"Qwen3.8-27B Tops Hugging Face Trending","url":"https://aicrier.com/post/0rytqz52bn1cbtfzs360","publishedAt":1787400001000,"collectedAt":1787410801000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Alibaba’s open-weight Qwen3.8-27B reportedly reached Hugging Face’s top trending position and surpassed 1 million downloads within two days. The 27B native multimodal model offers 262K-token context, extensible to 1M tokens."},{"headline":"Ox Alpha Stuns With One-Shot Game Build","url":"https://aicrier.com/post/96nn9f6wqaefdr27ecn6","publishedAt":1787399078000,"collectedAt":1787409878000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"The anonymous Ox Alpha model is turning heads with impressive one-shot frontend and game-generation demos, including a physics-based car game built from a single prompt. Available through OpenRouter and OpenCode, it offers multimodal input, a 1M-token context window, and free pre"},{"headline":"Claude Fable 5 stays frontier favorite","url":"https://aicrier.com/post/3s8hs24839wxo576ai52","publishedAt":1787398231000,"collectedAt":1787409031000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText" le","bodyText":"AI agents may multiply software labor, but they remain constrained by local hardware, concurrency, and compute budgets. Sandboxes shift the bottleneck from one device to scalable, pay-as-you-go execution environments."},{"headline":"Mercury Cloud Refreshes Free Model Limits","url":"https://aicrier.com/post/ql4kfyauqg3xhgabh35v","publishedAt":1787387419000,"collectedAt":1787398219000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Mercury Cloud has reset daily and weekly free model usage limits, restoring access for builders using its hosted model gateway. The service operates as a cloud control plane for locally running Mercury Agents."},{"headline":"[AINews] 10% worse, 100x cheaper, 10000x faster: Why Simulation is taking over","url":"https://www.latent.space/p/ainews-10-worse-100x-cheaper-10000x","publishedAt":1787384160000,"collectedAt":1787394960000,"sourceName":"Latent Space","intake":"feed","licenseClass":"article","bodyText":"By AI standards today is a pretty quiet Friday, so it’s time to take a step back and reflect on what is really going on. If you read our 2025 reading list, and followed our coverage of Z.ai GLM, understood the Poolside pivot, been following our AI for Science themes, and tuned in"},{"headline":"The Evolution of the Agent Harness","url":"https://www.latent.space/p/attention-interface","publishedAt":1787383852000,"collectedAt":1787394652000,"sourceName":"Latent Space","intake":"feed","licenseClass":"article","bodyText":"Sometime around Christmas 2025, AI engineers noticed a change in agents. They started to work! It’s hard to pin down exactly why. Maybe we finally had holiday downtime to try the newest agents with the newest models. Maybe the models had crossed some capability threshold. Maybe t"},{"headline":"DeepSeek Grayscale Tests Hint At Stronger Checkpoint","url":"https://aicrier.com/post/yz9zq2ubnf1f9q756ir9","publishedAt":1787383067000,"collectedAt":1787393867000,"sourceName":"aicrier","i enseClass":"article","bodyText":"Quick RSS is a private, lightweight RSS reader for macOS and iOS that centralizes news, blogs, and video feeds. Its newer MCP support lets trusted AI clients such as Claude Desktop, Cursor, and VS Code browse subscriptions and retrieve articles."},{"headline":"Agents Never Sleep Keeps Mac Agents Running","url":"https://aicrier.com/post/605hehuvfrn0wm8jxzsx","publishedAt":1787382060000,"collectedAt":1787392860000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Agents Never Sleep is a macOS menu bar app that keeps AI agents running when a MacBook’s lid is closed. It targets developers tired of leaving laptops half-open during long or unattended agent tasks."},{"headline":"SubtitleGenerator puts caption QA in browser","url":"https://aicrier.com/post/vu2p7sw0ecem58man8z4","publishedAt":1787382060000,"collectedAt":1787392860000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"SubtitleGenerator turns videos into editable, translated, styled subtitles in one browser-based workflow. Its free tier includes 60 one-minute videos monthly without signup, while paid plans add watermark-free HD exports, custom fonts, brand styles, and more formats."},{"headline":"PawVis Turns Webcam Into Gesture Mouse","url":"https://aicrier.com/post/k4xviv8f3qpoq2s2flqa","publishedAt":1787382060000,"collectedAt":1787392860000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"PawVis turns a Mac’s webcam into an on-device, hand-tracked mouse, supporting cursor control, clicking, scrolling, custom gestures, and optional voice commands. The free, open-source tool can also connect computer-use tasks to Codex or Claude Code."},{"headline":"Meta Pocket expands vibe-coded gizmos to US users","url":"https://aicrier.com/post/bq9yvdprjlrz076orm6i","publishedAt":1787382060000,"collectedAt":1787392860000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Meta’s Pocket lets k. It also creates public Cloudflare tunnels for local apps and is open source under Apache 2.0."},{"headline":"Kuaishou Profit Slide Overshadows Kling AI Growth","url":"https://aicrier.com/post/ai161jy5j5uak0d6n6uk","publishedAt":1787381481000,"collectedAt":1787392281000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"J.P. Morgan downgraded Kuaishou to Neutral after core-business profit fell more than expected, arguing that Kling AI’s revenue growth remains insufficient to support earlier optimism. Kuaishou reported more than RMB850 million in Q2 Kling revenue, up over 200% year over year, whi"},{"headline":"Now That’s What I Call Slop! Ships App","url":"https://aicrier.com/post/6bcp2cj2sedmtbddn8u6","publishedAt":1787371608000,"collectedAt":1787382408000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Andrew Ambrosino built a Spotify-style music app on ChatGPT Sites to host and share his album. The site includes album artwork, playlists, track metadata, audio playback, search, likes, and multiple volumes."},{"headline":"Kairic Edge targets Strix Halo inference","url":"https://aicrier.com/post/92jjdpzjx622ysanj2fd","publishedAt":1787369378000,"collectedAt":1787380178000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Kairic, in collaboration with Pete Hopton, introduces a custom Qwen3.8 27B build optimized for AMD Strix Halo. The project claims to be the first public 27B release with accelerated native-IU4 inference."},{"headline":"Binance Agent OS Opens Finance to Agents","url":"https://aicrier.com/post/edv4t63kprp2kwhg6cnt","publishedAt":1787367964000,"collectedAt":1787378764000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Binance introduced Agent OS, a standardized MCP-based layer connecting AI applications to trading, market data, wallets, payments, and onchain tools. Developers can authorize agents to operate within configurable permissions, inclu  a brief summer, but it has recently come back with a vengeance with SimGym in April and now Simile AI’s $2B Series B, backed by GreenOaks and Index Ventures with prominent backers like Fei-Fei Li and "},{"headline":"Peter Steinberger Drops New OpenClaw Skill","url":"https://aicrier.com/post/585rxvwj55to6vrlgqxi","publishedAt":1787355392000,"collectedAt":1787366192000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Peter Steinberger announced a new OpenClaw skill on X, but the post provides no name, documentation, or feature details beyond a related AI-assisted Linux coding example. The announcement is therefore best treated as an early teaser."},{"headline":"Browser Use Hits Human-Speed Browsing","url":"https://aicrier.com/post/bf4dom4g5xq2migj5eif","publishedAt":1787353437000,"collectedAt":1787364237000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"Browser Use says Qwen3.8-27B running with DFlash2 on two B200 GPUs can browse faster than humans while keeping costs low and accuracy high enough for most tasks. The claim highlights inference speed—not model intelligence—as the remaining bottleneck in browser automation."},{"headline":"0.150.0-alpha.6","url":"https://github.com/openai/codex/releases/tag/rust-v0.150.0-alpha.6","publishedAt":1787352327000,"collectedAt":1787363127000,"sourceName":"codex releases","intake":"feed","licenseClass":"permissive-release-notes","bodyText":"Release 0.150.0-alpha.6"},{"headline":"OpenAI’s Efficiency Flywheel Keeps Widening","url":"https://aicrier.com/post/m5ylay1uziw83xxzzov0","publishedAt":1787351112000,"collectedAt":1787361912000,"sourceName":"aicrier","intake":"feed","licenseClass":"article","bodyText":"OpenAI’s early investments across research, infrastructure, and model serving give it room to improve capabilities while lowering the cost of useful AI. That compounding advantage could translate into cheaper APIs, higher usage limits, and more capable agentic products."}, -lines-of-code/","publishedAt":1787179567000,"collectedAt":1787190367000,"sourceName":"Simon Willison","intake":"feed","licenseClass":"article","bodyText":"Last week I recorded an episode of the Talking Postgres podcast with Claire Giordano on the subject of \"How AI is changing software development\". We had a really great conversation. Here are a couple of my highlights from a lightly edited transcript (prompt to Claude: \"very minor"},{"headline":"Podcast: Amazon is Destroying Rare Books to Train AI","url":"https://www.404media.co/podcast-amazon-is-destroying-rare-books-to-train-ai/","publishedAt":1787169982000,"collectedAt":1787180782000,"sourceName":"404 Media","intake":"feed","licenseClass":"article","bodyText":"We start this week with Emanuel’s big story about Amazon buying, and destroying, masses of books to train AI. After the break we talk about a couple of wild cases where people are using AI. In the subscribers-only section, we talk about Meta’s new smart glasses patent and researc"},{"headline":"v2.1.236","url":"https://github.com/anthropics/claude-code/releases/tag/v2.1.236","publishedAt":1787169725000,"collectedAt":1787180525000,"sourceName":"claude-code releases","intake":"feed","licenseClass":"unlicensed-release-notes","bodyText":"What's changed\n\n- Added ANTHROPIC_DEFAULT_MODEL environment variable: sets the model new sessions start on, while a /model pick still overrides it and persists across restarts (unlike ANTHROPIC_MODEL)\n\n- Added notify_when_idle to cross-session SendMessage: ask another Claude Code"},{"headline":"Release v0.56.0","url":"https://github.com/google-gemini/gemini-cli/releases/tag/v0.56.0","publishedAt":1787167778000,"collectedAt":1787178578000,"sourceName":"gemini-cli releases","intake":"feed","licenseClass":"permissive-release-notes","bodyText":"Full Changelog: v0.55.1...v0.56.0"},{"headline":"Release v0.57.0-preview.0","url":"https://github.com/google-gemini/gemini-cli/releases/tag/v0.57.0-preview.0","publishedAt":17871671 ,{"name":"Latent Space","url":"https://www.latent.space/feed","licenseClass":"article","lastPolled":1787485471294,"error":null,"weekCount":9},{"name":"404 Media","url":"https://www.404media.co/rss/","licenseClass":"article","lastPolled":1787485471463,"error":null,"weekCount":15},{"name":"AI News","url":"https://buttondown.com/ainews/rss","licenseClass":"article","lastPolled":1787485471566,"error":null,"weekCount":0},{"name":"Computer Things","url":"https://buttondown.com/hillelwayne/rss","licenseClass":"article","lastPolled":1787485473463,"error":null,"weekCount":1},{"name":"Simon Willison","url":"https://simonwillison.net/atom/everything/","licenseClass":"article","lastPolled":1787485473727,"error":null,"weekCount":18},{"name":"AI News and Strategy Daily","url":"https://www.youtube.com/feeds/videos.xml?channel_id=UC0C-17n9iuUQPylguM1d-lQ","licenseClass":"article","lastPolled":1787485473801,"error":null,"weekCount":5},{"name":"aicrier","url":"https://aicrier.com/feed.xml","licenseClass":"article","lastPolled":1787485473859,"error":null,"weekCount":100},{"name":"claude-code releases","url":"https://github.com/anthropics/claude-code/releases.atom","licenseClass":"unlicensed-release-notes","lastPolled":1787485480900,"error":null,"weekCount":8},{"name":"codex releases","url":"https://github.com/openai/codex/releases.atom","licenseClass":"permissive-release-notes","lastPolled":1787485480951,"error":null,"weekCount":10},{"name":"gemini-cli releases","url":"https://github.com/google-gemini/gemini-cli/releases.atom","licenseClass":"permissive-release-notes","lastPolled":1787485481284,"error":null,"weekCount":9},{"name":"opencode releases","url":"https://github.com/sst/opencode/releases.atom","licenseClass":"permissive-release-notes","lastPolled":1787485481632,"error":null,"weekCount":3},{"name":"pi releases","url":"https://github.com/earendil-works/pi/releases.atom","licenseClass":"permissive-release-notes","lastPolled":1787485482177,"error":null,"weekCount":0}]}</script>
<script>
"use strict";

/* ---------- state ---------- */
const RAW = JSON.parse(document.getElementById("data").textContent);
const items = RAW.items.map((it, i) => ({
  id: i, ...it, state: "inbox", summary: "", topic: null,
}));
const sources = RAW.sources;
// All 14 polls succeeded on collection day, so the failing source is
// simulated on the least active one: AI News.
const failing = sources.find(s => s.name === "AI News");
failing.error = "HTTP 429 Too Many Requests";
failing.failedPolls = 4;
const topics = [];
let undoStack = [];

const VARIANTS = [
  ["A", "A - Triage list"],
  ["B", "B - Focus queue"],
  ["C", "C - Source digest"],
];
let variant = (location.hash.replace("#", "") || "A").toUpperCase();
if (!VARIANTS.some(v => v[0] === variant)) variant = "A";

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DAY = 86400000;
const dayKey = (ms) => new Date(ms).toISOString().slice(0, 10);
function dayLabel(key) {
  const today = dayKey(RAW.collectedOn);
  const yest = dayKey(RAW.collectedOn - DAY);
  if (key === today) return "Today";
  if (key === yest) return "Yesterday";
  return new Date(key + "T12:00:00Z").toUTCString().slice(0, 11);
}
const hm = (ms) => new Date(ms).toISOString().slice(11, 16);
const inbox = () => items.filter(i => i.state === "inbox");
const counts = () => ({
  inbox: items.filter(i => i.state === "inbox").length,
  approved: items.filter(i => i.state === "approved").length,
  discarded: items.filter(i => i.state === "discarded").length,
});

function setState(id, state, label) {
  const it = items.find(i => i.id === id);
  undoStack.push([[it.id, it.state]]);
  it.state = state;
  snack(label || (state === "approved" ? "Approved" : "Discarded"));
  render();
}
function bulkDiscard(ids) {
  undoStack.push(ids.map(id => [id, items.find(i => i.id === id).state]));
  for (const id of ids) items.find(i => i.id === id).state = "discarded";
  snack("Discarded " + ids.length + " items");
  render();
}
let snackTimer = null;
function snack(msg) {
  $("snack-msg").textContent = msg;
  $("snack").style.display = "flex";
  clearTimeout(snackTimer);
  snackTimer = setTimeout(() => { $("snack").style.display = "none"; }, 4000);
}
function undo() {
  const last = undoStack.pop();
  if (last) for (const [id, st] of last) items.find(i => i.id === id).state = st;
  $("snack").style.display = "none";
  render();
}
function addTopic() {
  const name = window.prompt("New topic name");
  if (!name || !name.trim()) return null;
  const t = name.trim();
  if (!topics.includes(t)) topics.push(t);
  return t;
}
let quickN = 0;
function fakeQuickAdd(url, extra, done) {
  // No network in the demo: the "page title read" is simulated.
  setTimeout(() => {
    let host = url;
    try { host = new URL(url).hostname.replace(/^www\./, ""); } catch (e) {}
    quickN++;
    items.unshift({
      id: 10000 + quickN,
      headline: "(title read from page) " + host + " item " + quickN,
      url, publishedAt: RAW.collectedOn, collectedAt: RAW.collectedOn,
      sourceName: null, intake: "quick-add", licenseClass: "owner-pasted",
      bodyText: null, state: "inbox", summary: "", topic: extra && extra.topic || null,
    });
    snack("Added to inbox");
    done && done();
    render();
  }, 600);
}
function countsHtml() {
  const c = counts();
  return '<div class="counts">' +
    "<span>INBOX <b>" + c.inbox + "</b></span>" +
    "<span>STREAM <b>" + c.approved + "</b></span>" +
    "<span>DISCARDED <b>" + c.discarded + "</b></span>" +
    "<span>SOURCES <b>" + sources.length + "</b></span></div>";
}
function failBannerHtml() {
  return '<div class="fail-banner"><span class="tag">1 SOURCE FAILING</span>' +
    "<span>" + esc(failing.name) + " - " + esc(failing.error) + " - 4 polls, about 24h</span>" +
    '<button class="btn ghost" style="margin-left:auto" onclick="snack(\'Poll queued (demo stub)\')">RETRY NOW</button></div>';
}

/* ---------- variant A: triage list ---------- */
let openRow = null;
function renderA(el) {
  const list = inbox();
  let html =
    '<p class="variant-title">Variant A - Triage list</p>' +
    '<p class="variant-sub">Every item is one row. Tap the headline to edit, tap a verdict to clear it. Quick-add is the sticky bar and needs only a URL.</p>' +
    '<div class="quickbar">' +
    '<input class="field" id="a-url" type="url" placeholder="https:// paste to add" style="flex:1">' +
    '<button class="btn primary" onclick="aAdd()">ADD</button></div>' +
    failBannerHtml() + countsHtml();

  let lastDay = null;
  for (const it of list) {
    const k = dayKey(it.publishedAt);
    if (k !== lastDay) {
      lastDay = k;
      const n = list.filter(x => dayKey(x.publishedAt) === k).length;
      html += '<div class="day-head"><span>' + dayLabel(k) + '</span><span class="n">' + n + " items</span></div>";
    }
    const open = openRow === it.id;
    html += '<div class="row' + (open ? " open" : "") + '">' +
      '<span class="t">' + hm(it.publishedAt) + "</span>" +
      '<span class="h" onclick="aToggle(' + it.id + ')"><span class="src">' + esc(it.sourceName || "you") + "</span>" +
      '<span class="hl">' + esc(it.headline) + "</span></span>" +
      '<span class="acts">' +
      '<button class="ok" onclick="setState(' + it.id + ',\'approved\')" aria-label="approve">&#10003;</button>' +
      '<button class="no" onclick="setState(' + it.id + ',\'discarded\')" aria-label="discard">&#10005;</button></span>';
    if (open) {
      html += '<div class="editor">' +
        '<div class="meta"><span class="chip">' + esc(it.licenseClass) + "</span><span>" + esc(it.intake) + "</span>" +
        '<a href="' + esc(it.url) + '" target="_blank" rel="noopener" class="chip lime">OPEN LINK</a></div>' +
        (it.bodyText ? '<div class="body">' + esc(it.bodyText) + "</div>" : "") +
        '<input class="field" value="' + esc(it.headline) + '" onchange="aEdit(' + it.id + ',\'headline\',this.value)">' +
        '<textarea class="field" rows="2" placeholder="Summary in our own words" onchange="aEdit(' + it.id + ',\'summary\',this.value)">' + esc(it.summary) + "</textarea>" +
        topicSelect(it) + "</div>";
    }
    html += "</div>";
  }
  if (!list.length) html += '<p class="quiet-note">Inbox is empty.</p>';
  el.innerHTML = html;
}
function aToggle(id) { openRow = openRow === id ? null : id; render(); }
function aEdit(id, field, value) { items.find(i => i.id === id)[field] = value; }
function aAdd() {
  const url = $("a-url").value.trim();
  if (!url) return;
  $("a-url").value = "";
  snack("Reading page title...");
  fakeQuickAdd(url, null);
}
function topicSelect(it) {
  let opts = '<option value="">No topic</option>';
  for (const t of topics) opts += '<option value="' + esc(t) + '"' + (it.topic === t ? " selected" : "") + ">" + esc(t) + "</option>";
  opts += '<option value="__new">+ New topic</option>';
  return '<select class="field" style="max-width:240px" onchange="pickTopic(' + it.id + ',this)">' + opts + "</select>";
}
function pickTopic(id, sel) {
  const it = items.find(i => i.id === id);
  if (sel.value === "__new") {
    const t = addTopic();
    it.topic = t;
  } else it.topic = sel.value || null;
  render();
}

/* ---------- variant B: focus queue ---------- */
let bTotal = null;
function renderB(el) {
  const list = inbox();
  if (bTotal === null) bTotal = list.length;
  const doneN = bTotal - list.length;
  let html =
    '<p class="variant-title">Variant B - Focus queue</p>' +
    '<p class="variant-sub">One item at a time, newest first. Edit in place, then verdict. Skip sends it to the back of the queue.</p>' +
    failBannerHtml() +
    '<div class="progress"><span>' + doneN + " done</span><span>" + list.length + " left</span></div>" +
    '<div class="pbar"><i style="width:' + (bTotal ? Math.round(doneN / bTotal * 100) : 0) + '%"></i></div>';

  const it = list[0];
  if (!it) {
    html += '<div class="done">Inbox zero. ' + counts().approved + " items in the stream.</div>";
  } else {
    let topicChips = topics.map(t =>
      '<button class="' + (it.topic === t ? "on" : "") + '" onclick="bTopic(' + it.id + ',\'' + esc(t) + '\')">' + esc(t) + "</button>").join("");
    topicChips += '<button onclick="bNewTopic(' + it.id + ')">+ topic</button>';
    html += '<div class="card">' +
      '<div class="meta"><span class="chip lime">' + esc(it.sourceName || "quick-add") + "</span>" +
      "<span>" + dayLabel(dayKey(it.publishedAt)) + " " + hm(it.publishedAt) + "</span>" +
      '<span class="chip">' + esc(it.licenseClass) + "</span>" +
      '<a class="chip" style="margin-left:auto" href="' + esc(it.url) + '" target="_blank" rel="noopener">OPEN</a></div>' +
      "<h2>" + esc(it.headline) + "</h2>" +
      (it.bodyText ? '<p class="body">' + esc(it.bodyText) + "</p>" : "") +
      '<textarea class="field" rows="3" placeholder="Summary in our own words" onchange="aEdit(' + it.id + ',\'summary\',this.value)">' + esc(it.summary) + "</textarea>" +
      '<div class="topics">' + topicChips + "</div></div>" +
      '<div class="verdicts">' +
      '<button class="btn danger" onclick="setState(' + it.id + ',\'discarded\')">&#10005; DISCARD</button>' +
      '<button class="btn ghost" onclick="bSkip(' + it.id + ')">SKIP</button>' +
      '<button class="btn primary" onclick="setState(' + it.id + ',\'approved\')">&#10003; APPROVE</button></div>';
  }
  html += '<button class="addfab" onclick="bSheet(true)" aria-label="quick-add">+</button><div id="b-overlay"></div>';
  el.innerHTML = html;
}
function bTopic(id, t) { const it = items.find(i => i.id === id); it.topic = it.topic === t ? null : t; render(); }
function bNewTopic(id) { const t = addTopic(); if (t) items.find(i => i.id === id).topic = t; render(); }
function bSkip(id) {
  const idx = items.findIndex(i => i.id === id);
  const [it] = items.splice(idx, 1);
  items.push(it);
  render();
}
function bSheet(show) {
  $("b-overlay").innerHTML = show ?
    '<div class="overlay" onclick="if(event.target===this)bSheet(false)"><div class="sheet">' +
    '<span class="mono" style="font-size:11px;font-weight:700;color:var(--accent-lime)">QUICK-ADD</span>' +
    '<input class="field" id="b-url" type="url" placeholder="https://">' +
    '<input class="field" id="b-note" placeholder="Why it matters (optional, becomes the summary)">' +
    '<div style="display:flex;gap:8px;justify-content:flex-end">' +
    '<button class="btn ghost" onclick="bSheet(false)">CANCEL</button>' +
    '<button class="btn primary" onclick="bAdd()">ADD</button></div></div></div>' : "";
  if (show) $("b-url").focus();
}
function bAdd() {
  const url = $("b-url").value.trim();
  const note = $("b-note").value.trim();
  if (!url) return;
  bSheet(false);
  snack("Reading page title...");
  bTotal++;
  fakeQuickAdd(url, null, () => {
    if (note) items.find(i => i.intake === "quick-add" && i.id === 10000 + quickN).summary = note;
  });
}

/* ---------- variant C: source digest ---------- */
const cOpen = new Set();
function renderC(el) {
  const list = inbox();
  const bySrc = new Map();
  for (const it of list) {
    const k = it.sourceName || "Pasted by you";
    if (!bySrc.has(k)) bySrc.set(k, []);
    bySrc.get(k).push(it);
  }
  const groups = [...bySrc.entries()].sort((a, b) => b[1].length - a[1].length);
  const quiet = sources.filter(s => !s.error && !bySrc.has(s.name));

  let html =
    '<p class="variant-title">Variant C - Source digest</p>' +
    '<p class="variant-sub">The week grouped by source, biggest first. A firehose stays one closed box, and one tap discards what is left in it.</p>' +
    countsHtml() +
    '<div class="paste"><span class="lbl">Paste a link</span>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
    '<input class="field" id="c-url" type="url" placeholder="https://" style="flex:1;min-width:200px">' +
    '<select class="field" id="c-topic" style="max-width:160px">' +
    '<option value="">No topic</option>' + topics.map(t => "<option>" + esc(t) + "</option>").join("") + "</select>" +
    '<button class="btn primary" onclick="cAdd()">ADD</button></div></div>';

  html += '<details data-fail open><summary><span><span class="name" style="color:var(--red)">' + esc(failing.name) + '</span>' +
    '<span class="sub">failing for about 24h</span></span><span class="badge err">4 FAILED POLLS</span></summary>' +
    '<div class="fail-body"><span>' + esc(failing.error) + " on every poll since yesterday 06:00. Last good poll served 0 items.</span>" +
    '<div style="display:flex;gap:8px"><button class="btn ghost" onclick="snack(\'Poll queued (demo stub)\')">RETRY NOW</button>' +
    '<button class="btn ghost" onclick="snack(\'Source disabled (demo stub)\')">DISABLE SOURCE</button></div></div></details>';

  for (const [name, its] of groups) {
    const open = cOpen.has(name);
    const src = sources.find(s => s.name === name);
    const shown = open ? its : [];
    html += '<details' + (open ? " open" : "") + ' ontoggle="cToggle(event,\'' + esc(name).replace(/'/g, "\\'") + '\')">' +
      '<summary><span><span class="name">' + esc(name) + '</span>' +
      '<span class="sub">' + esc(src ? src.licenseClass : "owner-pasted") + "</span></span>" +
      '<span class="badge' + (its.length >= 30 ? " hot" : "") + '">' + its.length + "</span></summary>";
    if (open) {
      html += '<div class="grp-acts">' +
        '<button class="btn danger" onclick="cDiscardRest(\'' + esc(name).replace(/'/g, "\\'") + '\')">DISCARD ALL ' + its.length + "</button></div>";
      for (const it of shown) {
        html += '<div class="it"><span style="min-width:0">' +
          '<a class="hl" style="display:block;text-decoration:none" href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.headline) + "</a>" +
          '<span class="d">' + dayLabel(dayKey(it.publishedAt)) + " " + hm(it.publishedAt) + "</span></span>" +
          '<span class="acts">' +
          '<button onclick="setState(' + it.id + ',\'approved\')" aria-label="approve">&#10003;</button>' +
          '<button onclick="setState(' + it.id + ',\'discarded\')" aria-label="discard">&#10005;</button></span></div>';
      }
    }
    html += "</details>";
  }
  if (quiet.length) {
    html += '<p class="quiet-note">Quiet this week: ' + quiet.map(s => esc(s.name)).join(", ") + ". No failure, no items.</p>";
  }
  el.innerHTML = html;
}
function cToggle(ev, name) {
  if (ev.target.open) cOpen.add(name); else cOpen.delete(name);
}
function cDiscardRest(name) {
  const ids = inbox().filter(i => (i.sourceName || "Pasted by you") === name).map(i => i.id);
  bulkDiscard(ids);
}
function cAdd() {
  const url = $("c-url").value.trim();
  const topic = $("c-topic").value || null;
  if (!url) return;
  $("c-url").value = "";
  snack("Reading page title...");
  fakeQuickAdd(url, { topic });
}

/* ---------- switcher ---------- */
function cycle(dir) {
  const idx = VARIANTS.findIndex(v => v[0] === variant);
  variant = VARIANTS[(idx + dir + VARIANTS.length) % VARIANTS.length][0];
  location.hash = variant;
  window.scrollTo(0, 0);
  render();
}
window.addEventListener("hashchange", () => {
  const h = location.hash.replace("#", "").toUpperCase();
  if (VARIANTS.some(v => v[0] === h) && h !== variant) { variant = h; render(); }
});

function render() {
  $("switch-lbl").textContent = VARIANTS.find(v => v[0] === variant)[1];
  for (const [key] of VARIANTS) $("v" + key).style.display = key === variant ? "" : "none";
  if (variant === "A") renderA($("vA"));
  if (variant === "B") renderB($("vB"));
  if (variant === "C") renderC($("vC"));
}
render();
</script>
</body>
</html>
